name: Build and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download offline WebView2 Runtime installer
        shell: pwsh
        run: |
          $installer = Join-Path $PWD 'desktop/MicrosoftEdgeWebView2RuntimeInstallerX64.exe'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/?linkid=2124701' -OutFile $installer
          $file = Get-Item $installer
          if ($file.Length -lt 50MB) {
            throw "Expected the standalone offline WebView2 installer (>50 MB), but downloaded only $([math]::Round($file.Length / 1MB, 1)) MB. The fwlink may have returned the small online bootstrapper."
          }
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft') {
            throw 'Downloaded WebView2 installer is not a valid Microsoft-signed executable.'
          }

      - name: Build and verify desktop app
        shell: pwsh
        run: ./desktop/build.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build single-file installer
        shell: pwsh
        run: |
          $version = '${{ inputs.tag || github.ref_name }}'.TrimStart('v')
          $env:APP_VERSION = $version
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" ./desktop/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup packaging failed.' }
          $installer = Get-ChildItem ./desktop/publish-installer/*.exe | Select-Object -First 1
          if (-not $installer) { throw 'Installer executable was not produced.' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content "$($installer.FullName).sha256" -Encoding ascii
          "INSTALLER=$($installer.FullName)" >> $env:GITHUB_ENV
          "CHECKSUM=$($installer.FullName).sha256" >> $env:GITHUB_ENV

      - name: Create GitHub Release and upload package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ inputs.tag || github.ref_name }}'
          gh release create $tag "$env:INSTALLER" "$env:CHECKSUM" --title "MD Viewer $tag" --generate-notes --verify-tag
