// Table cell merge/split tools
function buildTableGrid(table) {
  const rows = Array.from(table.rows);
  const grid = [];
  const origins = new Map();
  rows.forEach((row, rowIndex) => {
    if (!grid[rowIndex]) grid[rowIndex] = [];
    let columnIndex = 0;
    Array.from(row.cells).forEach(cell => {
      while (grid[rowIndex][columnIndex]) columnIndex++;
      const rowSpan = cell.rowSpan === 0 ? rows.length - rowIndex : Math.max(1, cell.rowSpan);
      const colSpan = Math.max(1, cell.colSpan);
      origins.set(cell, { row: rowIndex, col: columnIndex, rowSpan, colSpan });
      for (let r = rowIndex; r < Math.min(rows.length, rowIndex + rowSpan); r++) {
        if (!grid[r]) grid[r] = [];
        for (let c = columnIndex; c < columnIndex + colSpan; c++) {
          grid[r][c] = { cell, originRow: rowIndex, originCol: columnIndex };
        }
      }
      columnIndex += colSpan;
    });
  });
  return { table, rows, grid, origins };
}

function getTableCellContext(cell) {
  const table = cell && cell.closest('table');
  if (!table || !editorEl.contains(table)) return null;
  const context = buildTableGrid(table);
  const origin = context.origins.get(cell);
  return origin ? { ...context, cell, origin } : null;
}

function getMergeRightTarget(cell) {
  const context = getTableCellContext(cell);
  if (!context) return null;
  const { origin, grid } = context;
  const entry = grid[origin.row] && grid[origin.row][origin.col + origin.colSpan];
  if (!entry || entry.cell === cell || entry.originRow !== origin.row ||
      entry.originCol !== origin.col + origin.colSpan) return null;
  const targetOrigin = context.origins.get(entry.cell);
  if (!targetOrigin || targetOrigin.rowSpan !== origin.rowSpan ||
      entry.cell.tagName !== cell.tagName ||
      entry.cell.parentElement.parentElement !== cell.parentElement.parentElement) return null;
  return entry.cell;
}

function getMergeDownTarget(cell) {
  const context = getTableCellContext(cell);
  if (!context) return null;
  const { origin, grid } = context;
  const entry = grid[origin.row + origin.rowSpan] && grid[origin.row + origin.rowSpan][origin.col];
  if (!entry || entry.cell === cell || entry.originRow !== origin.row + origin.rowSpan ||
      entry.originCol !== origin.col) return null;
  const targetOrigin = context.origins.get(entry.cell);
  if (!targetOrigin || targetOrigin.colSpan !== origin.colSpan ||
      entry.cell.tagName !== cell.tagName ||
      entry.cell.parentElement.parentElement !== cell.parentElement.parentElement) return null;
  return entry.cell;
}

function hasMeaningfulCellContent(cell) {
  return Array.from(cell.childNodes).some(node =>
    node.nodeType === 3 ? node.textContent.trim() : node.nodeType === 1 && node.tagName !== 'BR'
  );
}

function appendMergedCellContent(cell, source) {
  if (!hasMeaningfulCellContent(source)) return;
  if (hasMeaningfulCellContent(cell)) cell.appendChild(document.createElement('br'));
  else cell.innerHTML = '';
  while (source.firstChild) cell.appendChild(source.firstChild);
}

function finishTableStructureEdit(cell) {
  cell.closest('table').dataset.mdRawTable = '1';
  schedulePreviewSync();
  scheduleHistorySnapshot();
  showTableCellTools(cell);
}

function mergeTableCellRight() {
  const cell = activeTableCell;
  const target = getMergeRightTarget(cell);
  if (!cell || !target) return;
  appendMergedCellContent(cell, target);
  cell.colSpan += target.colSpan;
  target.remove();
  finishTableStructureEdit(cell);
}

function mergeTableCellDown() {
  const cell = activeTableCell;
  const target = getMergeDownTarget(cell);
  if (!cell || !target) return;
  appendMergedCellContent(cell, target);
  cell.rowSpan += target.rowSpan;
  target.remove();
  finishTableStructureEdit(cell);
}

function splitTableCell() {
  const cell = activeTableCell;
  const context = getTableCellContext(cell);
  if (!context) return;
  const { origin, rows, origins } = context;
  if (origin.rowSpan === 1 && origin.colSpan === 1) return;

  cell.rowSpan = 1;
  cell.colSpan = 1;
  cell.removeAttribute('rowspan');
  cell.removeAttribute('colspan');
  for (let rowIndex = origin.row; rowIndex < origin.row + origin.rowSpan; rowIndex++) {
    const row = rows[rowIndex];
    if (!row) continue;
    const firstColumn = rowIndex === origin.row ? origin.col + 1 : origin.col;
    const lastColumn = origin.col + origin.colSpan;
    const existing = Array.from(row.cells).map(existingCell => ({
      cell: existingCell,
      col: origins.get(existingCell)?.col ?? Number.MAX_SAFE_INTEGER
    }));
    for (let column = firstColumn; column < lastColumn; column++) {
      const newCell = document.createElement(cell.tagName.toLowerCase());
      newCell.innerHTML = '<br>';
      const reference = existing.find(item => item.col > column)?.cell || null;
      row.insertBefore(newCell, reference);
    }
  }
  finishTableStructureEdit(cell);
}

function getTableColumnCount(context) {
  return Math.max(1, ...context.grid.map(row => row.length));
}

function insertTableRow(position) {
  const context = getTableCellContext(activeTableCell);
  if (!context) return;
  const { cell, origin, table, rows, origins } = context;
  const section = cell.parentElement.parentElement;
  const sectionRows = Array.from(section.rows);
  const sectionStart = rows.indexOf(sectionRows[0]);
  const requestedBoundary = position === 'above' ? origin.row : origin.row + origin.rowSpan;
  const boundary = Math.max(sectionStart, Math.min(sectionStart + sectionRows.length, requestedBoundary));
  const coveredColumns = new Set();
  origins.forEach((cellOrigin, spanningCell) => {
    if (spanningCell.parentElement.parentElement === section && cellOrigin.row < boundary &&
        cellOrigin.row + cellOrigin.rowSpan > boundary) {
      spanningCell.rowSpan = cellOrigin.rowSpan + 1;
      for (let column = cellOrigin.col; column < cellOrigin.col + cellOrigin.colSpan; column++) coveredColumns.add(column);
    }
  });
  const newRow = section.insertRow(boundary - sectionStart);
  const tagName = section.tagName === 'THEAD' ? 'th' : 'td';
  for (let column = 0; column < getTableColumnCount(context); column++) {
    if (coveredColumns.has(column)) continue;
    const newCell = document.createElement(tagName);
    newCell.innerHTML = '<br>';
    newRow.appendChild(newCell);
  }
  finishTableStructureEdit(cell);
}

function insertTableColumn(position) {
  const context = getTableCellContext(activeTableCell);
  if (!context) return;
  const { cell, origin, rows, origins } = context;
  const boundary = Math.max(0, Math.min(getTableColumnCount(context),
    position === 'left' ? origin.col : origin.col + origin.colSpan));
  const rowsCoveredByExpandedCells = new Set();
  origins.forEach((cellOrigin, spanningCell) => {
    if (cellOrigin.col < boundary && cellOrigin.col + cellOrigin.colSpan > boundary) {
      spanningCell.colSpan = cellOrigin.colSpan + 1;
      for (let row = cellOrigin.row; row < cellOrigin.row + cellOrigin.rowSpan; row++) rowsCoveredByExpandedCells.add(row);
    }
  });
  rows.forEach((row, rowIndex) => {
    if (rowsCoveredByExpandedCells.has(rowIndex)) return;
    const newCell = document.createElement(row.parentElement.tagName === 'THEAD' ? 'th' : 'td');
    newCell.innerHTML = '<br>';
    const reference = Array.from(row.cells).find(existingCell => (origins.get(existingCell)?.col ?? Number.MAX_SAFE_INTEGER) >= boundary) || null;
    row.insertBefore(newCell, reference);
  });
  finishTableStructureEdit(cell);
}

function canDeleteSelectedTableRow() {
  const context = getTableCellContext(activeTableCell);
  if (!context) return false;
  const rowIndex = context.rows.indexOf(activeTableCell.parentElement);
  const entries = context.grid[rowIndex] || [];
  return entries.every(entry => {
    const origin = context.origins.get(entry.cell);
    return origin && origin.row === rowIndex && origin.rowSpan === 1;
  });
}

function deleteSelectedTableRow() {
  const context = getTableCellContext(activeTableCell);
  if (!context || !canDeleteSelectedTableRow()) return;
  const table = context.table;
  activeTableCell.parentElement.remove();
  hideTableCellTools();
  if (!table.rows.length) {
    const wrapper = table.closest('.table-wrapper');
    (wrapper || table).remove();
  } else {
    table.dataset.mdRawTable = '1';
    const nextCell = table.querySelector('th,td');
    if (nextCell) showTableCellTools(nextCell);
  }
  schedulePreviewSync();
  scheduleHistorySnapshot();
}

function getSelectedLogicalColumnContext() {
  const context = getTableCellContext(activeTableCell);
  if (!context) return null;
  const column = context.origin.col;
  const entries = context.grid.map(row => row[column]).filter(Boolean);
  return { ...context, column, entries };
}

function canDeleteSelectedTableColumn() {
  const context = getSelectedLogicalColumnContext();
  if (!context) return false;
  return context.entries.every(entry => {
    const origin = context.origins.get(entry.cell);
    return origin && origin.col === context.column && origin.colSpan === 1;
  });
}

function deleteSelectedTableColumn() {
  const context = getSelectedLogicalColumnContext();
  if (!context || !canDeleteSelectedTableColumn()) return;
  const cells = new Set(context.entries.map(entry => entry.cell));
  cells.forEach(cell => cell.remove());
  hideTableCellTools();
  if (!context.table.querySelector('th,td')) {
    const wrapper = context.table.closest('.table-wrapper');
    (wrapper || context.table).remove();
  } else {
    context.table.dataset.mdRawTable = '1';
    showTableCellTools(context.table.querySelector('th,td'));
  }
  schedulePreviewSync();
  scheduleHistorySnapshot();
}

function deleteSelectedTable() {
  const table = activeTableCell && activeTableCell.closest('table');
  if (!table || !confirm('删除整个表格？')) return;
  hideTableCellTools();
  const wrapper = table.closest('.table-wrapper');
  (wrapper || table).remove();
  schedulePreviewSync();
  scheduleHistorySnapshot();
}

function normalizeFeishuTextColorsForExport(root) {
  root.querySelectorAll('span').forEach(span => {
    const token = getElementTextColorToken(span);
    Array.from(span.attributes).forEach(attribute => span.removeAttribute(attribute.name));
    if (token && FEISHU_TEXT_COLORS[token]) {
      span.setAttribute('text-color', token);
      span.style.color = FEISHU_TEXT_COLORS[token];
    }
  });
}

function createFeishuTableClone(table) {
  const clone = cloneTableForExport(table);
  const { grid } = buildTableGrid(table);
  const columnCount = Math.max(1, ...grid.map(row => row.length));
  if (!clone.querySelector(':scope > colgroup')) {
    const colgroup = document.createElement('colgroup');
    const measuredWidth = table.getBoundingClientRect().width || columnCount * 160;
    const columnWidth = Math.max(100, Math.min(300, Math.round(measuredWidth / columnCount)));
    for (let index = 0; index < columnCount; index++) {
      const col = document.createElement('col');
      col.setAttribute('width', columnWidth);
      colgroup.appendChild(col);
    }
    clone.insertBefore(colgroup, clone.firstChild);
  }
  clone.setAttribute('cellspacing', '0');
  clone.setAttribute('cellpadding', '0');
  clone.setAttribute('border', '1');
  clone.removeAttribute('style');
  clone.style.borderCollapse = 'collapse';
  clone.style.border = '1px solid #d0d3d8';
  clone.querySelectorAll('col').forEach(col => col.removeAttribute('style'));
  clone.querySelectorAll('th,td').forEach(cell => {
    const alignment = /^(left|center|right)$/.test(cell.style.textAlign) ? cell.style.textAlign : 'left';
    const backgroundToken = (cell.getAttribute('background-color') || '').toLowerCase();
    const backgroundColor = FEISHU_CELL_BACKGROUNDS[backgroundToken] || '';
    cell.removeAttribute('style');
    if (backgroundColor) {
      cell.setAttribute('background-color', backgroundToken);
    } else {
      cell.removeAttribute('background-color');
    }
    cell.style.border = '1px solid #d0d3d8';
    cell.style.padding = '6px 10px';
    cell.style.textAlign = alignment;
    cell.style.verticalAlign = 'top';
    if (backgroundColor) cell.style.backgroundColor = backgroundColor;
    cell.setAttribute('valign', 'top');
    cell.setAttribute('style', (cell.getAttribute('style') || '') + ';mso-number-format:"\\@";');
  });
  clone.querySelectorAll('th').forEach(cell => {
    cell.style.fontWeight = '600';
    if (!FEISHU_CELL_BACKGROUNDS[cell.getAttribute('background-color') || '']) {
      cell.style.backgroundColor = '#f5f6f7';
    }
  });
  normalizeFeishuTextColorsForExport(clone);
  return clone;
}

function getClipboardCellText(cell) {
  const clone = cell.cloneNode(true);
  clone.querySelectorAll('br').forEach(br => br.replaceWith('\n'));
  return (clone.textContent || '').replace(/\s*\n\s*/g, ' / ').trim();
}

function getFeishuTableText(table) {
  const { grid } = buildTableGrid(table);
  const columnCount = Math.max(1, ...grid.map(row => row.length));
  return grid.map((row, rowIndex) => {
    const values = [];
    for (let columnIndex = 0; columnIndex < columnCount; columnIndex++) {
      const entry = row[columnIndex];
      values.push(entry && entry.originRow === rowIndex && entry.originCol === columnIndex
        ? getClipboardCellText(entry.cell) : '');
    }
    return values.join('\t');
  }).join('\r\n');
}

function createFeishuHtmlShell(fragmentHtml, spreadsheetMode = false) {
  const namespaces = spreadsheetMode
    ? ' xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"'
    : '';
  const spreadsheetMeta = spreadsheetMode
    ? '<meta name="ProgId" content="Excel.Sheet"><meta name="Generator" content="Microsoft Excel 16">'
    : '<meta name="Generator" content="Kiro Markdown Viewer">';
  return '<html' + namespaces + '><head><meta charset="utf-8">' + spreadsheetMeta +
    '<style>body{font-family:Arial,sans-serif;}br{mso-data-placement:same-cell;}' +
    'table{border-collapse:collapse;mso-table-layout-alt:fixed;}pre{white-space:pre-wrap;}' +
    'blockquote{border-left:3px solid #d0d3d8;padding-left:10px;margin-left:0;}</style>' +
    '</head><body><!--StartFragment-->' + fragmentHtml + '<!--EndFragment--></body></html>';
}

function createFeishuClipboardHtml(table) {
  return createFeishuHtmlShell(createFeishuTableClone(table).outerHTML, true);
}

function setFeishuTableClipboard(event, table) {
  if (!event.clipboardData || !table) return false;
  event.clipboardData.setData('text/html', createFeishuClipboardHtml(table));
  event.clipboardData.setData('text/plain', getFeishuTableText(table));
  event.preventDefault();
  return true;
}

function safeDecodeURIComponent(value) {
  try { return decodeURIComponent(value || ''); }
  catch (error) { return value || ''; }
}

function createExportCodeBlock(label, source) {
  const fragment = document.createDocumentFragment();
  const caption = document.createElement('p');
  const bold = document.createElement('b');
  bold.textContent = label;
  caption.appendChild(bold);
  const pre = document.createElement('pre');
  const code = document.createElement('code');
  code.textContent = source || '';
  pre.appendChild(code);
  fragment.append(caption, pre);
  return fragment;
}

function replaceElementTag(element, tagName) {
  const replacement = document.createElement(tagName);
  while (element.firstChild) replacement.appendChild(element.firstChild);
  element.replaceWith(replacement);
  return replacement;
}

function isSafeExportUrl(value, image = false) {
  const raw = (value || '').trim();
  if (image && /^data:image\/(?:png|jpeg|gif|webp);base64,/i.test(raw)) return true;
  try {
    const protocol = new URL(raw, location.href).protocol;
    return image ? /^(https?:)$/.test(protocol) : /^(https?:|mailto:)$/.test(protocol);
  } catch (error) { return false; }
}

function normalizeFeishuExport(root) {
  root.querySelectorAll('.code-copy-btn,.code-lang-label').forEach(element => element.remove());
  root.querySelectorAll('.mermaid-container').forEach(container => {
    container.replaceWith(createExportCodeBlock('Mermaid', safeDecodeURIComponent(container.getAttribute('data-mermaid-source'))));
  });
  root.querySelectorAll('.codepen-container').forEach(container => {
    container.replaceWith(createExportCodeBlock('CodePen', safeDecodeURIComponent(container.getAttribute('data-codepen-source'))));
  });
  root.querySelectorAll('iframe').forEach(iframe => {
    const src = iframe.getAttribute('src') || '';
    const paragraph = document.createElement('p');
    if (isSafeExportUrl(src)) {
      const link = document.createElement('a');
      link.href = src;
      link.textContent = '嵌入内容：' + src;
      paragraph.appendChild(link);
    } else {
      paragraph.textContent = '嵌入内容已省略';
    }
    iframe.replaceWith(paragraph);
  });
  root.querySelectorAll('details').forEach(details => {
    const fragment = document.createDocumentFragment();
    const summary = details.querySelector(':scope > summary');
    if (summary) {
      const paragraph = document.createElement('p');
      const bold = document.createElement('b');
      bold.textContent = summary.textContent;
      paragraph.appendChild(bold);
      fragment.appendChild(paragraph);
    }
    Array.from(details.childNodes).forEach(node => {
      if (node !== summary) fragment.appendChild(node);
    });
    details.replaceWith(fragment);
  });
  root.querySelectorAll('input[type="checkbox"]').forEach(input => {
    input.replaceWith(document.createTextNode(input.checked ? '☑ ' : '☐ '));
  });
  root.querySelectorAll('.table-wrapper').forEach(wrapper => {
    const table = wrapper.querySelector(':scope > table');
    if (table) wrapper.replaceWith(table);
    else wrapper.replaceWith(...wrapper.childNodes);
  });
  root.querySelectorAll('table').forEach(table => table.replaceWith(createFeishuTableClone(table)));
  root.querySelectorAll('strong').forEach(element => replaceElementTag(element, 'b'));
  root.querySelectorAll('i').forEach(element => replaceElementTag(element, 'em'));
  root.querySelectorAll('s').forEach(element => replaceElementTag(element, 'del'));
  normalizeFeishuTextColorsForExport(root);
  root.querySelectorAll('script,object,embed,form,meta,link,style,button').forEach(element => element.remove());

  const allowedTags = new Set(['H1','H2','H3','H4','H5','H6','P','BR','B','EM','U','DEL','CODE','PRE','A','IMG','UL','OL','LI','BLOCKQUOTE','HR','TABLE','COLGROUP','COL','THEAD','TBODY','TFOOT','TR','TH','TD','SPAN']);
  Array.from(root.querySelectorAll('*')).reverse().forEach(element => {
    if (!allowedTags.has(element.tagName)) {
      element.replaceWith(...element.childNodes);
      return;
    }
    const allowedAttributes = {
      A: ['href'], IMG: ['src','alt','width','height'], OL: ['start'],
      TABLE: ['border','cellspacing','cellpadding','style'], COL: ['width','span'],
      TH: ['colspan','rowspan','align','valign','background-color','style'], TD: ['colspan','rowspan','align','valign','background-color','style'],
      SPAN: ['text-color','style'],
      H1: ['align'], H2: ['align'], H3: ['align'], H4: ['align'], H5: ['align'], H6: ['align'], P: ['align'], LI: ['align']
    };
    const keep = new Set(allowedAttributes[element.tagName] || []);
    Array.from(element.attributes).forEach(attribute => {
      if (!keep.has(attribute.name.toLowerCase())) element.removeAttribute(attribute.name);
    });
    if (element.tagName === 'A' && !isSafeExportUrl(element.getAttribute('href'))) {
      element.replaceWith(...element.childNodes);
    } else if (element.tagName === 'IMG' && !isSafeExportUrl(element.getAttribute('src'), true)) {
      const fallback = document.createElement('span');
      fallback.textContent = '[图片：' + (element.getAttribute('alt') || '无法复制的本地图片') + ']';
      element.replaceWith(fallback);
    }
  });
  return root;
}

function getFeishuDocumentText(root) {
  const clone = root.cloneNode(true);
  clone.querySelectorAll('table').forEach(table => {
    const pre = document.createElement('pre');
    pre.textContent = getFeishuTableText(table);
    table.replaceWith(pre);
  });
  clone.querySelectorAll('hr').forEach(hr => hr.replaceWith(document.createTextNode('\n---\n')));
  clone.querySelectorAll('img').forEach(img => img.replaceWith(document.createTextNode('[图片：' + (img.alt || img.src) + ']')));
  const host = document.createElement('div');
  host.style.cssText = 'position:fixed;left:-10000px;top:0;width:800px;white-space:pre-wrap;';
  host.appendChild(clone);
  document.body.appendChild(host);
  const text = host.innerText.replace(/\n{3,}/g, '\n\n').trim();
  host.remove();
  return text;
}

function setFeishuDocumentClipboard(event, root) {
  if (!event.clipboardData || !root) return false;
  normalizeFeishuExport(root);
  event.clipboardData.setData('text/html', createFeishuHtmlShell(root.innerHTML));
  event.clipboardData.setData('text/plain', getFeishuDocumentText(root));
  event.preventDefault();
  return true;
}

function getSelectedSourceTable() {
  if (!isSourceMode || document.activeElement !== sourceEditor) return null;
  const selected = sourceEditor.value.slice(sourceEditor.selectionStart, sourceEditor.selectionEnd).trim();
  if (!/^<(?:table|thead|tbody|tr)\b[\s\S]*<\/table>\s*$/i.test(selected)) return null;
  const template = document.createElement('template');
  template.innerHTML = mdToHtml(selected);
  return template.content.querySelector('table');
}

function getSelectedSourceDocument() {
  if (!isSourceMode || document.activeElement !== sourceEditor ||
      sourceEditor.selectionStart !== 0 || sourceEditor.selectionEnd !== sourceEditor.value.length ||
      !sourceEditor.value.trim()) return null;
  const root = document.createElement('div');
  root.innerHTML = mdToHtml(normalizeMarkdownBeforeRender(sourceEditor.value));
  return root;
}

function getPreviewSelectionRoot() {
  const selection = window.getSelection();
  if (!selection || !selection.rangeCount || selection.isCollapsed) return null;
  const anchor = selection.anchorNode && (selection.anchorNode.nodeType === 1 ? selection.anchorNode : selection.anchorNode.parentElement);
  const focus = selection.focusNode && (selection.focusNode.nodeType === 1 ? selection.focusNode : selection.focusNode.parentElement);
  if (!anchor || !focus || !editorEl.contains(anchor) || !editorEl.contains(focus)) return null;
  const root = document.createElement('div');
  root.appendChild(selection.getRangeAt(0).cloneContents());
  return root;
}

function handleFeishuCompatibleCopy(event) {
  const sourceTable = getSelectedSourceTable();
  if (sourceTable) {
    setFeishuTableClipboard(event, sourceTable);
    return;
  }
  const sourceDocument = getSelectedSourceDocument();
  if (sourceDocument) {
    setFeishuDocumentClipboard(event, sourceDocument);
    return;
  }
  if (isSourceMode) return;

  const selection = window.getSelection();
  const table = activeTableCell && activeTableCell.closest('table');
  if (table && selection && selection.rangeCount) {
    const anchor = selection.anchorNode && (selection.anchorNode.nodeType === 1 ? selection.anchorNode : selection.anchorNode.parentElement);
    const focus = selection.focusNode && (selection.focusNode.nodeType === 1 ? selection.focusNode : selection.focusNode.parentElement);
    if (anchor && focus && table.contains(anchor) && table.contains(focus)) {
      setFeishuTableClipboard(event, table);
      return;
    }
  }
  const selectedRoot = getPreviewSelectionRoot();
  if (selectedRoot) setFeishuDocumentClipboard(event, selectedRoot);
}

function createFeishuPasteRoot(clipboardHtml) {
  if (!clipboardHtml || !/<(?:table|thead|tbody|tr|td|th)\b/i.test(clipboardHtml)) return null;
  const fullDocument = new DOMParser().parseFromString(clipboardHtml, 'text/html');
  const fragmentMatch = clipboardHtml.match(/<!--StartFragment-->([\s\S]*?)<!--EndFragment-->/i);
  const fragmentHtml = fragmentMatch ? fragmentMatch[1] : fullDocument.body.innerHTML;
  const root = document.createElement('div');
  root.innerHTML = fragmentHtml;
  if (!root.querySelector('table')) return null;

  root.querySelectorAll('script,iframe,object,embed,form,meta,link,template').forEach(element => element.remove());
  root.querySelectorAll('*').forEach(element => {
    Array.from(element.attributes).forEach(attribute => {
      const name = attribute.name.toLowerCase();
      if (name.startsWith('on') || name === 'srcdoc') element.removeAttribute(attribute.name);
    });
    const style = element.getAttribute('style') || '';
    if (/url\s*\(|expression\s*\(|behavior\s*:|-moz-binding/i.test(style)) {
      element.setAttribute('style', style.split(';').filter(rule =>
        !/url\s*\(|expression\s*\(|behavior\s*:|-moz-binding/i.test(rule)
      ).join(';'));
    }
  });
  const deferredImages = [];
  root.querySelectorAll('img[src]').forEach(image => {
    deferredImages.push([image, image.getAttribute('src')]);
    image.removeAttribute('src');
  });

  normalizeImportedCellBackgrounds(root);
  const host = document.createElement('div');
  host.style.cssText = 'position:fixed;left:-100000px;top:0;width:1200px;height:1px;overflow:hidden;pointer-events:none;';
  const shadow = host.attachShadow({ mode: 'open' });
  fullDocument.querySelectorAll('style').forEach(sourceStyle => {
    const style = document.createElement('style');
    style.textContent = sourceStyle.textContent.replace(/@import[^;]+;?/gi, '').replace(/url\s*\([^)]*\)/gi, 'none');
    shadow.appendChild(style);
  });
  const scopeHtml = document.createElement('html');
  scopeHtml.className = fullDocument.documentElement.className;
  const scopeBody = document.createElement('body');
  scopeBody.className = fullDocument.body.className;
  scopeBody.appendChild(root);
  scopeHtml.appendChild(scopeBody);
  shadow.appendChild(scopeHtml);
  document.body.appendChild(host);

  root.querySelectorAll('th,td').forEach(cell => {
    if (getImportedBackgroundDescriptor(cell)) return;
    const candidates = [cell, ...cell.querySelectorAll('*'), cell.closest('tr')];
    for (const candidate of candidates) {
      if (!candidate) continue;
      const css = normalizeImportedCssBackground(getComputedStyle(candidate).backgroundColor);
      if (!css) continue;
      const token = getFeishuCellBackgroundToken(css);
      if (token) cell.setAttribute('background-color', token);
      cell.style.backgroundColor = token ? FEISHU_CELL_BACKGROUNDS[token] : css;
      const table = cell.closest('table');
      if (table) table.dataset.mdRawTable = '1';
      break;
    }
  });
  scopeBody.removeChild(root);
  host.remove();
  deferredImages.forEach(([image, src]) => {
    if (src && !/^\s*javascript:/i.test(src)) image.setAttribute('src', src);
  });
  root.querySelectorAll('style').forEach(style => style.remove());
  normalizeImportedCellBackgrounds(root);
  return root;
}

function insertSourceTextAtSelection(text) {
  const start = sourceEditor.selectionStart;
  const end = sourceEditor.selectionEnd;
  const before = sourceEditor.value.slice(0, start);
  const after = sourceEditor.value.slice(end);
  const prefix = before && !/\n\s*\n$/.test(before) ? '\n\n' : '';
  const suffix = after && !/^\s*\n/.test(after) ? '\n\n' : '';
  const inserted = prefix + text + suffix;
  sourceEditor.setRangeText(inserted, start, end, 'end');
  sourceEditor.dispatchEvent(new InputEvent('input', { bubbles: true, inputType: 'insertFromPaste', data: inserted }));
}

function handleFeishuCompatiblePaste(event) {
  const html = event.clipboardData && event.clipboardData.getData('text/html');
  const root = createFeishuPasteRoot(html);
  if (!root) return;
  event.preventDefault();
  if (event.currentTarget === sourceEditor) {
    insertSourceTextAtSelection(domToMd(root).trim());
    return;
  }
  if (event.currentTarget === editorEl) {
    editorEl.focus();
    document.execCommand('insertHTML', false, root.innerHTML);
    schedulePreviewSync();
    scheduleHistorySnapshot();
  }
}

function updateCellBackgroundPalette() {
  const activeToken = activeTableCell ? (activeTableCell.getAttribute('background-color') || '') : '';
  document.querySelectorAll('[data-cell-background]').forEach(button => {
    button.setAttribute('aria-pressed', String(button.dataset.cellBackground === activeToken));
  });
}

function clearCellBackgroundHistory() {
  cellBackgroundUndoStack = [];
  cellBackgroundRedoStack = [];
}

function getCellBackgroundState(cell) {
  return {
    token: (cell.getAttribute('background-color') || '').toLowerCase(),
    style: cell.style.backgroundColor || ''
  };
}

function setCellBackgroundState(cell, state) {
  const token = state && FEISHU_CELL_BACKGROUNDS[state.token] ? state.token : '';
  if (token) {
    cell.setAttribute('background-color', token);
    cell.style.backgroundColor = FEISHU_CELL_BACKGROUNDS[token];
  } else {
    cell.removeAttribute('background-color');
    if (state && state.style) cell.style.backgroundColor = state.style;
    else cell.style.removeProperty('background-color');
    if (!cell.getAttribute('style')) cell.removeAttribute('style');
  }
  const table = cell.closest('table');
  if (table) table.dataset.mdRawTable = '1';
}

function syncCellBackgroundChange(cell) {
  if (activeTableCell === cell) updateCellBackgroundPalette();
  schedulePreviewSync();
  scheduleHistorySnapshot();
  requestAnimationFrame(positionTableCellTools);
}

function undoCellBackground() {
  while (cellBackgroundUndoStack.length) {
    const record = cellBackgroundUndoStack.pop();
    if (!record.cell.isConnected) continue;
    setCellBackgroundState(record.cell, record.before);
    cellBackgroundRedoStack.push(record);
    syncCellBackgroundChange(record.cell);
    return true;
  }
  return false;
}

function redoCellBackground() {
  while (cellBackgroundRedoStack.length) {
    const record = cellBackgroundRedoStack.pop();
    if (!record.cell.isConnected) continue;
    setCellBackgroundState(record.cell, record.after);
    cellBackgroundUndoStack.push(record);
    syncCellBackgroundChange(record.cell);
    return true;
  }
  return false;
}

function applyCellBackground(token) {
  if (!activeTableCell || !activeTableCell.isConnected) return;
  if (token && !FEISHU_CELL_BACKGROUNDS[token]) return;
  const cell = activeTableCell;
  const before = getCellBackgroundState(cell);
  const after = { token: token || '', style: token ? FEISHU_CELL_BACKGROUNDS[token] : '' };
  if (before.token === after.token && (after.token || before.style === after.style)) return;
  setCellBackgroundState(cell, after);
  cellBackgroundUndoStack.push({ cell, before, after });
  cellBackgroundRedoStack = [];
  syncCellBackgroundChange(cell);
}

function positionTableCellTools() {
  const tools = document.getElementById('tableCellTools');
  if (!activeTableCell || !activeTableCell.isConnected || !tools.classList.contains('active')) return;
  const rect = activeTableCell.getBoundingClientRect();
  const outsideViewport = rect.bottom < 40 || rect.top > window.innerHeight - 24 || rect.right < 0 || rect.left > window.innerWidth;
  tools.style.visibility = outsideViewport ? 'hidden' : 'visible';
  if (outsideViewport) return;
  const toolsHeight = tools.offsetHeight;
  let top = rect.top - toolsHeight - 8;
  if (top < 44) top = rect.bottom + 8;
  if (top + toolsHeight > window.innerHeight - 28) {
    top = Math.max(44, window.innerHeight - toolsHeight - 28);
  }
  const left = Math.max(8, Math.min(rect.left, window.innerWidth - tools.offsetWidth - 8));
  tools.style.top = top + 'px';
  tools.style.left = left + 'px';
}

function showTableCellTools(cell) {
  if (!cell || isSourceMode) return;
  hideTextColorPalette();
  if (activeTableCell && activeTableCell !== cell) activeTableCell.classList.remove('table-cell-selected');
  activeTableCell = cell;
  cell.classList.add('table-cell-selected');
  const tools = document.getElementById('tableCellTools');
  tools.classList.add('active');
  document.getElementById('mergeCellRightBtn').disabled = !getMergeRightTarget(cell);
  document.getElementById('mergeCellDownBtn').disabled = !getMergeDownTarget(cell);
  document.getElementById('splitCellBtn').disabled = cell.colSpan === 1 && cell.rowSpan === 1;
  document.getElementById('deleteTableRowBtn').disabled = !canDeleteSelectedTableRow();
  document.getElementById('deleteTableColumnBtn').disabled = !canDeleteSelectedTableColumn();
  updateCellBackgroundPalette();
  requestAnimationFrame(positionTableCellTools);
}

function hideTableCellTools() {
  if (activeTableCell) activeTableCell.classList.remove('table-cell-selected');
  activeTableCell = null;
  const tools = document.getElementById('tableCellTools');
  if (tools) {
    tools.classList.remove('active');
    tools.style.visibility = '';
  }
}

// Save
async function saveFile() {
  if (!isSourceMode) flushPreviewChanges();
  let md;
  if (isSourceMode) {
    md = sourceEditor.value;
    if (activeFileIndex >= 0) openFiles[activeFileIndex].content = md;
  } else if (activeFileIndex >= 0) {
    md = openFiles[activeFileIndex].content;
  } else {
    md = getMarkdown();
  }

  if (activeFileIndex >= 0) {
    const current = openFiles[activeFileIndex];
    await createHistorySnapshot(current, '保存前磁盘版本', current.savedContent);
    await createHistorySnapshot(current, '保存版本', md);
  }

  if (activeFileIndex >= 0 && openFiles[activeFileIndex].handle) {
    try {
      const handle = openFiles[activeFileIndex].handle;
      const writable = await handle.createWritable();
      await writable.write(md);
      await writable.close();
      markSaved(await getHandleLastModified(handle));
      showSaveNotice();
      return;
    } catch (e) {
      if (e.name === 'NotAllowedError') {
        try {
          const perm = await openFiles[activeFileIndex].handle.requestPermission({ mode: 'readwrite' });
          if (perm === 'granted') {
            const writable = await openFiles[activeFileIndex].handle.createWritable();
            await writable.write(md);
            await writable.close();
            markSaved(await getHandleLastModified(openFiles[activeFileIndex].handle));
            showSaveNotice();
            return;
          }
        } catch (e2) { /* fall through */ }
      }
    }
  }

  const blob = new Blob([md], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filenameEl.textContent === '未打开文件' ? 'document.md' : filenameEl.textContent.replace(/^● /, '');
  a.click();
  URL.revokeObjectURL(a.href);
  markSaved(Date.now());
  showSaveNotice();
}

function showSaveNotice() {
  const name = activeFileIndex >= 0 ? openFiles[activeFileIndex].name : '未打开文件';
  filenameEl.textContent = name + ' ✓ 已保存';
  setTimeout(() => {
    filenameEl.textContent = activeFileIndex >= 0 ? openFiles[activeFileIndex].name : '未打开文件';
  }, 2000);
}

let previewSyncTimer = null;
let previewIdleHandle = null;
let previewIdleUsesCallback = false;
let lastEditorActivityAt = 0;
let previewDirty = false;

function cancelDeferredPreviewFlush() {
  if (previewSyncTimer) {
    clearTimeout(previewSyncTimer);
    previewSyncTimer = null;
  }
  if (previewIdleHandle !== null) {
    if (previewIdleUsesCallback && window.cancelIdleCallback) cancelIdleCallback(previewIdleHandle);
    else clearTimeout(previewIdleHandle);
    previewIdleHandle = null;
  }
}

function flushPreviewChanges() {
  cancelDeferredPreviewFlush();
  if (!previewDirty) return;

  if (activeFileIndex >= 0 && openFiles[activeFileIndex]) {
    // Convert the existing DOM directly. Avoid serializing and reparsing large SVG/table content.
    openFiles[activeFileIndex].content = domToMd(editorEl).trim();
  }
  previewDirty = false;
  updateCounts();
  updateOutline();
  markModified();
}

function queuePreviewIdleFlush() {
  previewSyncTimer = null;
  if (window.requestIdleCallback) {
    previewIdleUsesCallback = true;
    previewIdleHandle = requestIdleCallback(() => {
      previewIdleHandle = null;
      flushPreviewChanges();
    }, { timeout: 1000 });
  } else {
    previewIdleUsesCallback = false;
    previewIdleHandle = setTimeout(() => {
      previewIdleHandle = null;
      flushPreviewChanges();
    }, 0);
  }
}

function schedulePreviewSync() {
  previewDirty = true;
  sessionDirty = true;
  lastEditorActivityAt = Date.now();
  if (activeFileIndex >= 0) {
    isModified = true;
    filenameEl.classList.add('modified');
    modifiedEl.textContent = '已修改';
  }
  cancelDeferredPreviewFlush();
  const contentLength = activeFileIndex >= 0 && openFiles[activeFileIndex]
    ? openFiles[activeFileIndex].content.length : 0;
  const delay = contentLength > 1000000 ? 850 : contentLength > 250000 ? 550 : 350;
  previewSyncTimer = setTimeout(queuePreviewIdleFlush, delay);
}

    return;
  }
  if (e.ctrlKey && !e.altKey && ((key === 'y' && !e.shiftKey) || (key === 'z' && e.shiftKey)) && cellBackgroundRedoStack.length) {
    if (redoCellBackground()) e.preventDefault();
    return;
  }
  if (e.key === 'Escape' && textColorPalette.classList.contains('active')) {
    hideTextColorPalette();
    return;
  }
  if (e.key === 'Escape' && tableCellTools.classList.contains('active')) {
    hideTableCellTools();
    return;
  }
  if (e.ctrlKey && e.key === 'o') { e.preventDefault(); openFile(); }
  if (e.ctrlKey && e.key === 's') { e.preventDefault(); saveFile(); }
  if (e.ctrlKey && e.key === 'r') { e.preventDefault(); reloadFile(); }
  if (e.ctrlKey && e.key === '/') { e.preventDefault(); toggleSource(); }
  if (e.ctrlKey && e.key === 'p') { e.preventDefault(); window.print(); }
});

// === Persistent edit history ===
const HISTORY_LIMIT = 30;
let historyDbPromise = null;
let historySnapshotTimer = null;
const historyWriteQueues = new Map();

function ensureHistoryKey(file) {
  if (!file) return '';
  if (!file.historyKey) {
    if (file.serverPath) {
      file.historyKey = 'server:' + file.serverPath.replace(/\\/g, '/').toLowerCase();
    } else {
      const id = crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2);
      file.historyKey = 'local:' + id;
    }
    sessionDirty = true;
  }
  return file.historyKey;
}

function openHistoryDB() {
  if (historyDbPromise) return historyDbPromise;
  historyDbPromise = new Promise((resolve, reject) => {
    const request = indexedDB.open('md-viewer-history', 1);
    request.onupgradeneeded = event => {
      const db = event.target.result;
      if (!db.objectStoreNames.contains('snapshots')) {
        const store = db.createObjectStore('snapshots', { keyPath: 'id', autoIncrement: true });
        store.createIndex('fileKey', 'fileKey', { unique: false });
      }
    };
    request.onsuccess = event => resolve(event.target.result);
    request.onerror = () => reject(request.error);
  });
  return historyDbPromise;
}

function waitForTransaction(transaction) {
  return new Promise((resolve, reject) => {
    transaction.oncomplete = resolve;
    transaction.onerror = () => reject(transaction.error);
    transaction.onabort = () => reject(transaction.error || new Error('History transaction aborted'));
  });
}

async function getHistorySnapshots(fileKey) {
  if (!fileKey) return [];
  const db = await openHistoryDB();
  const transaction = db.transaction('snapshots', 'readonly');
  const request = transaction.objectStore('snapshots').index('fileKey').getAll(IDBKeyRange.only(fileKey));
  const entries = await new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result || []);
    request.onerror = () => reject(request.error);
  });
  return entries.sort((a, b) => b.createdAt - a.createdAt);
}

async function getHistorySnapshot(id) {
  const db = await openHistoryDB();
  const transaction = db.transaction('snapshots', 'readonly');
  const request = transaction.objectStore('snapshots').get(Number(id));
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result || null);
    request.onerror = () => reject(request.error);
  });
}

function createHistorySnapshot(file, reason, contentOverride) {
  if (!file) return Promise.resolve();
  const fileKey = ensureHistoryKey(file);
  const content = String(contentOverride !== undefined ? contentOverride : file.content || '');
  const previous = historyWriteQueues.get(fileKey) || Promise.resolve();
  const job = previous.catch(() => {}).then(async () => {
    const existing = await getHistorySnapshots(fileKey);
    if (existing[0] && existing[0].content === content) return;
    const db = await openHistoryDB();
    const transaction = db.transaction('snapshots', 'readwrite');
    const store = transaction.objectStore('snapshots');
    store.add({ fileKey, fileName: file.name, createdAt: Date.now(), reason, content });
    existing.slice(HISTORY_LIMIT - 1).forEach(entry => store.delete(entry.id));
    await waitForTransaction(transaction);
  });
  historyWriteQueues.set(fileKey, job);
  return job.catch(error => console.warn('Unable to save history snapshot.', error));
}

function getCurrentEditorContent(file) {
  if (!file) return '';
  if (openFiles[activeFileIndex] === file && isSourceMode) return sourceEditor.value;
  if (openFiles[activeFileIndex] === file && previewDirty) flushPreviewChanges();
  return file.content || '';
}

function scheduleHistorySnapshot() {
  if (activeFileIndex < 0) return;
  const file = openFiles[activeFileIndex];
  if (historySnapshotTimer) clearTimeout(historySnapshotTimer);
  historySnapshotTimer = setTimeout(() => {
    historySnapshotTimer = null;
    createHistorySnapshot(file, '自动编辑快照', getCurrentEditorContent(file));
  }, 1500);
}

async function showHistory() {
  if (activeFileIndex < 0) {
    alert('请先打开 Markdown 文件');
    return;
  }
  const file = openFiles[activeFileIndex];
  await createHistorySnapshot(file, '当前编辑状态', getCurrentEditorContent(file));
  document.getElementById('historyTitle').textContent = '历史记录 · ' + file.name;
  document.getElementById('historyModal').classList.add('active');
  const list = document.getElementById('historyList');
  list.innerHTML = '<div class="fb-empty">正在加载...</div>';
  try {
    renderHistoryList(await getHistorySnapshots(ensureHistoryKey(file)));
  } catch (error) {
    list.innerHTML = '<div class="fb-empty">历史记录加载失败</div>';
  }
}

function renderHistoryList(entries) {
  const list = document.getElementById('historyList');
  list.innerHTML = '';
  if (!entries.length) {
    list.innerHTML = '<div class="fb-empty">暂无历史记录</div>';
    document.getElementById('historyPreviewMeta').textContent = '选择左侧版本进行预览';
    document.getElementById('historyPreviewContent').innerHTML = '<div class="fb-empty">暂无预览</div>';
    return;
  }
  entries.forEach(entry => {
    const item = document.createElement('div');
    item.className = 'history-item';
    item.dataset.snapshotId = entry.id;
    const meta = document.createElement('div');
    meta.className = 'history-meta';
    meta.textContent = new Date(entry.createdAt).toLocaleString();
    const reason = document.createElement('span');
    reason.className = 'history-reason';
    reason.textContent = entry.reason || '历史快照';
    meta.appendChild(reason);
    const excerpt = document.createElement('div');
    excerpt.className = 'history-excerpt';
    excerpt.textContent = entry.content.replace(/\s+/g, ' ').slice(0, 140) || '（空文档）';
    const actions = document.createElement('div');
    actions.className = 'history-actions';
    const previewButton = document.createElement('button');
    previewButton.className = 'history-preview-button';
    previewButton.textContent = '预览';
    previewButton.onclick = event => {
      event.stopPropagation();
      renderHistoryPreview(entry);
    };
    const restore = document.createElement('button');
    restore.className = 'history-restore';
    restore.textContent = '回退';
    restore.onclick = event => {
      event.stopPropagation();
      restoreHistorySnapshot(entry.id);
    };
    actions.append(previewButton, restore);
    item.append(meta, excerpt, actions);
    item.onclick = () => renderHistoryPreview(entry);
    list.appendChild(item);
  });
  renderHistoryPreview(entries[0]);
}

function renderHistoryPreview(entry) {
  document.querySelectorAll('#historyList .history-item').forEach(item => {
    item.classList.toggle('active', Number(item.dataset.snapshotId) === Number(entry.id));
  });
  document.getElementById('historyPreviewMeta').textContent =
    new Date(entry.createdAt).toLocaleString() + ' · ' + (entry.reason || '历史快照') +
    ' · ' + entry.content.length + ' 字符';

  const template = document.createElement('template');
  template.innerHTML = mdToHtml(entry.content);
  template.content.querySelectorAll('script, iframe, object, embed, form, meta, link, style').forEach(element => element.remove());
  template.content.querySelectorAll('*').forEach(element => {
    Array.from(element.attributes).forEach(attribute => {
      if (attribute.name.toLowerCase().startsWith('on')) element.removeAttribute(attribute.name);
    });
    ['href', 'src'].forEach(name => {
      const value = element.getAttribute(name) || '';
      if (/^\s*javascript:/i.test(value)) element.removeAttribute(name);
    });
    if (element.tagName === 'A') {
      element.setAttribute('target', '_blank');
      element.setAttribute('rel', 'noopener noreferrer');
    }
  });
  const preview = document.getElementById('historyPreviewContent');
  preview.replaceChildren(template.content.cloneNode(true));
  preview.scrollTop = 0;
}

function closeHistory() {
  document.getElementById('historyModal').classList.remove('active');
}

async function restoreHistorySnapshot(id) {
  const entry = await getHistorySnapshot(id);
  const current = activeFileIndex >= 0 ? openFiles[activeFileIndex] : null;
  if (!entry || !current || entry.fileKey !== ensureHistoryKey(current)) return;
  if (!confirm('回退到该历史版本？回退结果不会立即写入磁盘。')) return;
  await createHistorySnapshot(current, '回退前', getCurrentEditorContent(current));
  current.content = entry.content;
  if (isSourceMode) {
    sourceEditor.value = entry.content;
    updateOutline();
  } else {
    loadMarkdown(entry.content);
  }
  sessionDirty = true;
  markModified();
  saveSession();
  modifiedEl.textContent = isModified ? '已回退（未保存）' : '';
  closeHistory();
}

async function clearCurrentHistory() {
  const current = activeFileIndex >= 0 ? openFiles[activeFileIndex] : null;
  if (!current || !confirm('清空当前文件的全部历史记录？')) return;
  const entries = await getHistorySnapshots(ensureHistoryKey(current));
  const db = await openHistoryDB();
  const transaction = db.transaction('snapshots', 'readwrite');
  const store = transaction.objectStore('snapshots');
  entries.forEach(entry => store.delete(entry.id));
  await waitForTransaction(transaction);
  renderHistoryList([]);
}

// === File auto-refresh recovery ===
// On localhost, IndexedDB handles persist and queryPermission returns 'granted' automatically.
// On file://, user must manually re-open. We show link hint in status bar for that case.

function openHandleDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('md-viewer-handles', 1);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('handles')) {
        db.createObjectStore('handles', { keyPath: 'name' });
      }
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = () => reject(req.error);
  });
}

async function saveHandlesToDB() {
  try {
    const db = await openHandleDB();
    const tx = db.transaction('handles', 'readwrite');
    const store = tx.objectStore('handles');
    store.clear();
    for (const f of openFiles) {
      if (f.handle) {
        store.put({ name: f.name, handle: f.handle });
      }
    }
  } catch (e) { /* ignore */ }
}

async function restoreHandlesFromDB() {
  try {
    const db = await openHandleDB();
    const tx = db.transaction('handles', 'readonly');
    const store = tx.objectStore('handles');
    const all = await new Promise((resolve, reject) => {
      const req = store.getAll();
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    for (const item of all) {
      const idx = openFiles.findIndex(f => f.name === item.name);
      if (idx >= 0 && item.handle) {
        openFiles[idx].handle = item.handle;
        openFiles[idx].needsPermission = false;
      }
    }
    await silentRefreshAll();
  } catch (e) {
    console.warn('Unable to restore file handles.', e);
  }
  updateLinkHint();
}

async function silentRefreshAll() {
  let activeContentChanged = false;
  for (const f of openFiles) {
    if (!f.handle) continue;
    try {
      const permission = await f.handle.queryPermission({ mode: 'read' });
      if (permission === 'granted') {
        const file = await f.handle.getFile();
        const metadataUnchanged = f.lastModified === file.lastModified &&
          (f.fileSize === undefined || f.fileSize === file.size);
        f.lastModified = file.lastModified;
        f.fileSize = file.size;
        f.needsPermission = false;

        if (!metadataUnchanged) {
          const content = await file.text();
          const localContent = openFiles[activeFileIndex] === f && isSourceMode
            ? sourceEditor.value
            : f.content;
          if (content !== f.savedContent) {
            if (localContent !== f.savedContent && localContent !== content) {
              f.externalContent = content;
              f.externalLastModified = file.lastModified;
            } else {
              f.content = content;
              f.savedContent = content;
              delete f.externalContent;
              delete f.externalLastModified;
              if (openFiles[activeFileIndex] === f) activeContentChanged = true;
            }
          }
        }
      } else {
        // Keep the persisted handle so a user click can request permission again.
        f.needsPermission = true;
      }
    } catch (e) {
      f.needsPermission = true;
      console.warn('File handle needs to be linked again.', e);
    }
  }

  const current = activeFileIndex >= 0 ? openFiles[activeFileIndex] : null;
  if (current && current.handle && !current.needsPermission) {
    if (activeContentChanged) {
      if (isSourceMode) {
        sourceEditor.value = current.content;
        updateOutline();
      } else {
        loadMarkdown(current.content);
      }
      markSaved();
    } else {
      updateLastModifiedDisplay();
      if (current.externalContent) {
        modifiedEl.textContent = '有未保存修改（磁盘文件也已更新）';
      }
    }
  }
}

function updateLinkHint() {
  const hint = document.getElementById('linkFileHint');
  if (!hint) return;
  const current = activeFileIndex >= 0 ? openFiles[activeFileIndex] : null;
  const needsAction = current && !current.serverPath && (!current.handle || current.needsPermission);
  hint.style.display = needsAction ? '' : 'none';
  if (needsAction) {
    hint.textContent = current.handle
      ? '⚠ 点击授权文件访问，启用实时更新'
      : '⚠ 点击重新关联文件，启用实时更新';
  }
}

async function bindHandleToFile(current, handle) {
  if (openFiles[activeFileIndex] === current && !isSourceMode && previewDirty) {
    flushPreviewChanges();
  }
  const file = await handle.getFile();
  const isActive = openFiles[activeFileIndex] === current;
  const localContent = isActive && isSourceMode ? sourceEditor.value : current.content;
  const hasLocalChanges = localContent !== current.savedContent;
  const metadataUnchanged = current.lastModified === file.lastModified &&
    (current.fileSize === undefined || current.fileSize === file.size);

  current.handle = handle;
  current.needsPermission = false;
  current.name = file.name;
  current.lastModified = file.lastModified;
  current.fileSize = file.size;

  let contentChanged = false;
  if (!metadataUnchanged) {
    const content = await file.text();
    if (content !== current.savedContent) {
      if (hasLocalChanges && localContent !== content) {
        current.externalContent = content;
        current.externalLastModified = file.lastModified;
        if (openFiles[activeFileIndex] === current) {
          modifiedEl.textContent = '有未保存修改（磁盘文件也已更新）';
        }
      } else {
        current.content = content;
        current.savedContent = content;
        delete current.externalContent;
        delete current.externalLastModified;
        contentChanged = true;
      }
    }
  }

  if (openFiles[activeFileIndex] === current) {
    filenameEl.textContent = file.name;
    updateLastModifiedDisplay();
    if (contentChanged && localContent !== current.content) {
      if (isSourceMode) {
        sourceEditor.value = current.content;
        updateOutline();
      } else {
        loadMarkdown(current.content);
      }
    }
    if (contentChanged) markSaved();
  }
  renderFileList();
  updateLinkHint();
  if (contentChanged) saveSession();
  await saveHandlesToDB();
}

async function relinkCurrentFile() {
  if (activeFileIndex < 0) return;
  const current = openFiles[activeFileIndex];

  if (current.handle && typeof current.handle.requestPermission === 'function') {
    try {
      const permission = await current.handle.requestPermission({ mode: 'read' });
      if (permission === 'granted') {
        await bindHandleToFile(current, current.handle);
        return;
      }
    } catch (e) {
      console.warn('Existing file handle could not be authorized.', e);
    }
  }

  if (!window.showOpenFilePicker) return;
  try {
    const [handle] = await window.showOpenFilePicker({
      multiple: false,
      types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md', '.markdown', '.txt'] } }]
    });
    await bindHandleToFile(current, handle);
  } catch (e) {
    if (e.name !== 'AbortError') console.error(e);
  }
}

function checkNeedRelink() {
  updateLinkHint();
}

// Session persistence
let sessionDirty = false;

let sessionSaveRetryAt = 0;
let sessionSaveWarningShown = false;
function saveSession() {
  if (Date.now() < sessionSaveRetryAt) return;
  try {
    if (!isSourceMode) flushPreviewChanges();
    if (isSourceMode && activeFileIndex >= 0 && activeFileIndex < openFiles.length) {
      openFiles[activeFileIndex].content = sourceEditor.value;
    }
    const session = {
      files: openFiles.map(f => ({
        name: f.name,
        content: f.content,
        savedContent: f.savedContent === f.content ? null : f.savedContent,
        serverPath: f.serverPath || null,
        historyKey: f.historyKey || null,
        lastModified: f.lastModified || null,
        fileSize: f.fileSize !== undefined ? f.fileSize : null
      })),
      activeIndex: activeFileIndex
    };
    localStorage.setItem('md-viewer-session', JSON.stringify(session));
    sessionDirty = false;
    sessionSaveRetryAt = 0;
    sessionSaveWarningShown = false;
  } catch (e) {
    sessionSaveRetryAt = Date.now() + 60000;
    if (!sessionSaveWarningShown) {
      sessionSaveWarningShown = true;
      console.warn('Session cache is full or unavailable; retrying in 60 seconds.', e);
    }
  }
}

function restoreSession() {
  try {
    // Restore theme
    const savedTheme = localStorage.getItem('md-viewer-theme');
    if (savedTheme && savedTheme !== 'light') {
      currentTheme = 'light';
      if (savedTheme === 'eye-care') { toggleTheme(); }
      else if (savedTheme === 'dark') { toggleTheme(); toggleTheme(); }
    }
    setContentWidth(localStorage.getItem('md-viewer-content-width') || 'standard', false);
    const data = localStorage.getItem('md-viewer-session');
    if (!data) return;
    const session = JSON.parse(data);
    if (session.files && session.files.length > 0) {
      openFiles = session.files.map(f => ({
        name: f.name,
        content: f.content,
        savedContent: f.savedContent !== null && f.savedContent !== undefined ? f.savedContent : f.content,
        handle: null,
        serverPath: f.serverPath || null,
        historyKey: f.historyKey || null,
        lastModified: f.lastModified || null,
        fileSize: f.fileSize !== null && f.fileSize !== undefined ? f.fileSize : undefined
      }));
      activeFileIndex = session.activeIndex >= 0 ? session.activeIndex : 0;
      renderFileList();
      const file = openFiles[activeFileIndex];
      if (file) {
        ensureHistoryKey(file);
        createHistorySnapshot(file, '会话恢复', file.savedContent);
        filenameEl.textContent = file.name;
        loadMarkdown(file.content);
        markModified();
      }
      // Check if file needs re-linking for auto-refresh
      restoreHandlesFromDB();
    }
  } catch (e) { /* ignore parse errors */ }
}

// Persist only after the user has paused; never force a full DOM serialization mid-keystroke.
setInterval(() => {
  const editorIdle = Date.now() - lastEditorActivityAt > 1200;
  if (sessionDirty && editorIdle && !sourceCompositionActive && !previewSyncTimer && previewIdleHandle === null) saveSession();
}, 5000);
window.addEventListener('beforeunload', () => { if (sessionDirty) saveSession(); });

// Init - wrapped so a render error can't break the whole UI
try {
  restoreSession();
} catch (e) {
  console.error('restoreSession failed:', e);
}

// If in server mode and active file has serverPath, start polling for live updates
if (isServerMode && activeFileIndex >= 0 && openFiles[activeFileIndex] && openFiles[activeFileIndex].serverPath) {
  startServerWatch();
}

// === Browsing enhancements ===

// Minimap (right side progress preview)
const minimapEl = document.getElementById('minimap');
const minimapThumb = document.getElementById('minimapThumb');
const minimapMarkers = document.getElementById('minimapMarkers');
const editorWrapper = document.getElementById('editorWrapper');

function updateMinimap() {
  const scrollTop = editorWrapper.scrollTop;
  const scrollHeight = editorWrapper.scrollHeight;
  const clientHeight = editorWrapper.clientHeight;
  const trackHeight = minimapEl.clientHeight;

  if (scrollHeight <= clientHeight) {
    minimapThumb.style.display = 'none';
    return;
  }
  minimapThumb.style.display = '';

  // Thumb size proportional to viewport/content ratio
  const thumbHeight = Math.max(20, (clientHeight / scrollHeight) * trackHeight);
  const thumbTop = (scrollTop / (scrollHeight - clientHeight)) * (trackHeight - thumbHeight);

  minimapThumb.style.height = thumbHeight + 'px';
  minimapThumb.style.top = thumbTop + 'px';
}

function updateMinimapMarkers() {
  const headings = editorEl.querySelectorAll('h1, h2, h3');
  const scrollHeight = editorWrapper.scrollHeight;
  const trackHeight = minimapEl.clientHeight;
  if (scrollHeight <= 0 || trackHeight <= 0) { minimapMarkers.innerHTML = ''; return; }

  let html = '';
  headings.forEach(h => {
    const top = h.offsetTop;
    const pct = top / scrollHeight;
    const y = pct * trackHeight;
    const level = h.tagName.toLowerCase();
    html += '<div class="marker ' + level + '" style="top:' + y + 'px"></div>';
  });
  minimapMarkers.innerHTML = html;
}

let minimapUpdateFrame = null;
let minimapRefreshFrame = null;
function scheduleMinimapUpdate() {
  if (minimapUpdateFrame !== null) return;
  minimapUpdateFrame = requestAnimationFrame(() => {
    minimapUpdateFrame = null;
    updateMinimap();
  });
}

function scheduleMinimapRefresh() {
  if (minimapRefreshFrame !== null || isSourceMode) return;
  minimapRefreshFrame = requestAnimationFrame(() => {
    minimapRefreshFrame = requestAnimationFrame(() => {
      minimapRefreshFrame = null;
      updateMinimap();
      updateMinimapMarkers();
    });
  });
}

editorWrapper.addEventListener('scroll', scheduleMinimapUpdate);
window.addEventListener('resize', scheduleMinimapRefresh);

// Minimap drag to scroll
let minimapDragging = false;
minimapThumb.addEventListener('mousedown', (e) => {
  e.preventDefault();
  minimapDragging = true;
  minimapEl.classList.add('active');
  document.body.style.cursor = 'grabbing';
  document.body.style.userSelect = 'none';
});
document.addEventListener('mousemove', (e) => {
  if (!minimapDragging) return;
  const rect = minimapEl.getBoundingClientRect();
  const trackHeight = rect.height;
  const thumbHeight = minimapThumb.offsetHeight;
  const y = e.clientY - rect.top - thumbHeight / 2;
  const ratio = Math.max(0, Math.min(1, y / (trackHeight - thumbHeight)));
  const scrollHeight = editorWrapper.scrollHeight - editorWrapper.clientHeight;
  editorWrapper.scrollTop = ratio * scrollHeight;
});
document.addEventListener('mouseup', () => {
  if (minimapDragging) {
    minimapDragging = false;
    minimapEl.classList.remove('active');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  }
});

// Click on minimap track to jump
minimapEl.addEventListener('click', (e) => {
  if (e.target === minimapThumb) return;
  const rect = minimapEl.getBoundingClientRect();
  const y = e.clientY - rect.top;
  const ratio = y / rect.height;
  const scrollHeight = editorWrapper.scrollHeight - editorWrapper.clientHeight;
  editorWrapper.scrollTo({ top: ratio * scrollHeight, behavior: 'smooth' });
});

// Update minimap after content load
setTimeout(scheduleMinimapRefresh, 100);

// Back to top button
const backToTopBtn = document.getElementById('backToTop');
editorWrapper.addEventListener('scroll', () => {
  if (editorWrapper.scrollTop > 300) {
    backToTopBtn.classList.add('visible');
  } else {
    backToTopBtn.classList.remove('visible');
  }
});
backToTopBtn.addEventListener('click', () => {
  editorWrapper.scrollTo({ top: 0, behavior: 'smooth' });
});

// Outline heading tracking on scroll
let trackingTimer = null;
editorWrapper.addEventListener('scroll', () => {
  if (trackingTimer) return;
  trackingTimer = setTimeout(() => {
    trackingTimer = null;
    updateActiveHeading();
  }, 100);
});

function updateActiveHeading() {
  const headings = editorEl.querySelectorAll('h1, h2, h3, h4');
  if (headings.length === 0) return;
  const wrapperTop = editorWrapper.getBoundingClientRect().top;
  let activeIdx = 0;
  for (let i = 0; i < headings.length; i++) {
    const rect = headings[i].getBoundingClientRect();
    if (rect.top - wrapperTop <= 60) {
      activeIdx = i;
    } else {
      break;
    }
  }
  const items = outlineListEl.querySelectorAll('li');
  items.forEach((li, i) => {
    li.classList.toggle('active-heading', i === activeIdx);
  });
  // Scroll outline item into view
  if (items[activeIdx]) {
    items[activeIdx].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

// Image lightbox
const lightbox = document.getElementById('lightbox');
const lightboxImg = lightbox.querySelector('img');
editorEl.addEventListener('click', (e) => {
  if (e.target.tagName === 'IMG' && !e.target.closest('.mermaid-container')) {
    lightboxImg.src = e.target.src;
    lightbox.classList.add('active');
  }
});
lightbox.addEventListener('click', () => {
  lightbox.classList.remove('active');
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && lightbox.classList.contains('active')) {
    lightbox.classList.remove('active');
  }
  if (e.key === 'Escape') {
    const fb = document.getElementById('fileBrowser');
    if (fb && fb.classList.contains('active')) fb.classList.remove('active');
    closeHistory();
  }
});

// Click outside file browser dialog closes it
(function(){
  const fb = document.getElementById('fileBrowser');
  if (fb) fb.addEventListener('click', (e) => { if (e.target === fb) fb.classList.remove('active'); });
})();

// Table wrapper for responsive scrolling & task list enhancement
function enhanceRenderedContent(root = editorEl) {
  normalizeImportedCellBackgrounds(root);
  collectScopedElements(root, 'table').forEach(table => {
    if (!table.parentElement || table.parentElement.classList.contains('table-wrapper')) return;
    const wrapper = document.createElement('div');
    wrapper.className = 'table-wrapper';
    table.parentNode.insertBefore(wrapper, table);
    wrapper.appendChild(table);
  });

  const lists = new Set(collectScopedElements(root, 'ul'));
  if (root.nodeType === 1) {
    const ancestorList = root.closest('ul');
    if (ancestorList && editorEl.contains(ancestorList)) lists.add(ancestorList);
  }
  lists.forEach(ul => {
    const items = ul.querySelectorAll(':scope > li');
    let isTaskList = false;
    items.forEach(li => {
      const text = li.innerHTML;
      if (/^\s*<input[^>]*type="checkbox"[^>]*>/i.test(text)) {
        isTaskList = true;
      } else if (/^\[[ x]\]\s/i.test(text)) {
        isTaskList = true;
        const checked = /^\[x\]/i.test(text);
        li.innerHTML = '<input type="checkbox"' + (checked ? ' checked' : '') + '> ' + text.replace(/^\[[ x]\]\s*/i, '');
      }
    });
    if (isTaskList) ul.classList.add('task-list');
  });
}

// Enhance only subtrees affected by structural edits; avoid rescanning the full document.
let enhancementScheduled = false;
const pendingEnhancementRoots = new Set();
const editorObserver = new MutationObserver(records => {
  if (observerPaused) return;
  records.forEach(record => {
    record.addedNodes.forEach(node => {
      const root = node.nodeType === 1 ? node : node.parentElement;
      if (root && editorEl.contains(root)) pendingEnhancementRoots.add(root);
    });
    if (record.removedNodes.length && record.target && editorEl.contains(record.target)) {
      pendingEnhancementRoots.add(record.target.nodeType === 1 ? record.target : record.target.parentElement);
    }
  });
  if (enhancementScheduled) return;
  enhancementScheduled = true;
  requestAnimationFrame(() => {
    enhancementScheduled = false;
    if (observerPaused) return;
    const roots = Array.from(pendingEnhancementRoots).filter(root => root && root.isConnected);
    pendingEnhancementRoots.clear();
    observerPaused = true;
    try {
      if (roots.length > 40 || roots.includes(editorEl)) enhanceRenderedContent(editorEl);
      else roots.forEach(root => enhanceRenderedContent(root));
      editorObserver.takeRecords();
    } finally {
      observerPaused = false;
    }
    scheduleMinimapRefresh();
  });
});
editorObserver.observe(editorEl, { childList: true, subtree: true });

// Initial enhance
enhanceRenderedContent();

} // end initApp
</script>
</body>
</html>
