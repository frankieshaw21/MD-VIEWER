<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown Editor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%234a90d9'/><path d='M5 22V10h4l3 5 3-5h4v12h-4v-6l-3 4-3-4v6H5zm17-12v12h3l4-5v5h3V10h-3l-4 5v-5h-3z' fill='white'/></svg>">
<link rel="stylesheet" href="assets/md-viewer.css">
</head>
<body>
<div class="drag-overlay" id="dragOverlay">📄 拖放 .md 文件到这里</div>
<div class="minimap" id="minimap">
  <div class="minimap-content">
    <div class="minimap-track"></div>
    <div class="minimap-markers" id="minimapMarkers"></div>
    <div class="minimap-thumb" id="minimapThumb"></div>
  </div>
</div>
<button class="back-to-top" id="backToTop" title="回到顶部">↑</button>
<div class="lightbox-overlay" id="lightbox"><img src="" alt=""></div>
<div class="fb-overlay" id="fileBrowser">
  <div class="fb-dialog">
    <div class="fb-header">
      <span>打开文件</span>
      <button class="fb-close" onclick="closeFileBrowser()">×</button>
    </div>
    <div class="fb-path">
      <button class="fb-up" onclick="fbGoUp()" title="上一级">↑</button>
      <input type="text" id="fbPathInput" onkeydown="if(event.key==='Enter')fbNavigate(this.value)" placeholder="输入路径后回车，或下方选择">
      <button class="fb-drives" onclick="fbNavigate('DRIVES')" title="所有磁盘">💾</button>
    </div>
    <div class="fb-list" id="fbList"></div>
  </div>
</div>
<div class="fb-overlay" id="historyModal" onclick="if(event.target===this)closeHistory()">
  <div class="fb-dialog history-dialog">
    <div class="fb-header">
      <span id="historyTitle">历史记录</span>
      <div class="history-header-actions">
        <button class="history-clear" onclick="clearCurrentHistory()">清空历史</button>
        <button class="fb-close" onclick="closeHistory()">×</button>
      </div>
    </div>
    <div class="history-body">
      <div class="fb-list" id="historyList"><div class="fb-empty">正在加载...</div></div>
      <div class="history-preview-pane">
        <div class="history-preview-meta" id="historyPreviewMeta">选择左侧版本进行预览</div>
        <div class="history-markdown" id="historyPreviewContent"><div class="fb-empty">暂无预览</div></div>
      </div>
    </div>
  </div>
</div>
<div class="table-cell-tools" id="tableCellTools" contenteditable="false" role="menu" aria-label="表格操作">
  <div class="table-tools-header">
    <span class="table-tools-header-icon">▦</span>
    <span class="table-tools-title">表格操作</span>
    <kbd>Esc</kbd>
  </div>
  <div class="table-tools-section">
    <div class="table-tools-section-label">单元格</div>
    <div class="table-tools-actions three">
      <button type="button" id="mergeCellRightBtn"><span class="table-tool-icon">⇥</span><span>向右合并</span></button>
      <button type="button" id="mergeCellDownBtn"><span class="table-tool-icon">⇩</span><span>向下合并</span></button>
      <button type="button" id="splitCellBtn"><span class="table-tool-icon">⧉</span><span>拆分</span></button>
    </div>
  </div>
  <div class="table-tools-section">
    <div class="table-tools-section-label">行与列</div>
    <div class="table-tools-actions">
      <button type="button" id="insertRowAboveBtn"><span class="table-tool-icon">↑</span><span>上方插入行</span></button>
      <button type="button" id="insertRowBelowBtn"><span class="table-tool-icon">↓</span><span>下方插入行</span></button>
      <button type="button" id="insertColumnLeftBtn"><span class="table-tool-icon">←</span><span>左侧插入列</span></button>
      <button type="button" id="insertColumnRightBtn"><span class="table-tool-icon">→</span><span>右侧插入列</span></button>
    </div>
  </div>
  <div class="table-tools-section">
    <div class="table-tools-section-label">单元格颜色</div>
    <div class="cell-background-palette" id="cellBackgroundPalette">
      <button type="button" class="cell-color-swatch clear-color" data-cell-background="" title="清除背景色" aria-label="清除背景色"></button>
      <button type="button" class="cell-color-swatch" data-cell-background="light-red" title="浅红" aria-label="浅红" style="background:#fde2e2"></button>
      <button type="button" class="cell-color-swatch" data-cell-background="light-orange" title="浅橙" aria-label="浅橙" style="background:#fee7cd"></button>
      <button type="button" class="cell-color-swatch" data-cell-background="light-yellow" title="浅黄" aria-label="浅黄" style="background:#fff1cc"></button>
      <button type="button" class="cell-color-swatch" data-cell-background="light-green" title="浅绿" aria-label="浅绿" style="background:#d9f5d6"></button>
      <button type="button" class="cell-color-swatch" data-cell-background="light-blue" title="浅蓝" aria-label="浅蓝" style="background:#dbeafe"></button>
      <button type="button" class="cell-color-swatch" data-cell-background="light-purple" title="浅紫" aria-label="浅紫" style="background:#e9e4ff"></button>
      <button type="button" class="cell-color-swatch" data-cell-background="light-gray" title="浅灰" aria-label="浅灰" style="background:#e5e6eb"></button>
    </div>
  </div>
  <div class="table-tools-section table-tools-danger">
    <div class="table-tools-section-label">删除</div>
    <div class="table-tools-actions">
      <button type="button" id="deleteTableRowBtn"><span class="table-tool-icon">−</span><span>删除当前行</span></button>
      <button type="button" id="deleteTableColumnBtn"><span class="table-tool-icon">−</span><span>删除当前列</span></button>
      <button type="button" id="deleteTableBtn" class="delete-table"><span class="table-tool-icon">×</span><span>删除整个表格</span></button>
    </div>
  </div>
</div>
<div class="text-color-palette" id="textColorPalette" contenteditable="false" role="menu" aria-label="文字颜色">
  <div class="text-color-palette-title">文字颜色 · 飞书标准色</div>
  <div class="color-swatch-grid">
    <button type="button" class="color-swatch" data-text-color="red" title="红色" aria-label="红色" style="background:#d83931"></button>
    <button type="button" class="color-swatch" data-text-color="orange" title="橙色" aria-label="橙色" style="background:#de7802"></button>
    <button type="button" class="color-swatch" data-text-color="yellow" title="黄色" aria-label="黄色" style="background:#dc9b04"></button>
    <button type="button" class="color-swatch" data-text-color="green" title="绿色" aria-label="绿色" style="background:#2d9f46"></button>
    <button type="button" class="color-swatch" data-text-color="blue" title="蓝色" aria-label="蓝色" style="background:#3370ff"></button>
    <button type="button" class="color-swatch" data-text-color="purple" title="紫色" aria-label="紫色" style="background:#7b67ee"></button>
    <button type="button" class="color-swatch" data-text-color="gray" title="灰色" aria-label="灰色" style="background:#646a73"></button>
  </div>
</div>
<div class="app">
  <div class="toolbar">
    <button onclick="openFile()" data-tip="打开文件 Ctrl+O">📂</button>
    <button onclick="reloadFile()" data-tip="重新加载 Ctrl+R">🔄</button>
    <button onclick="saveFile()" data-tip="保存 Ctrl+S">💾</button>
    <button onclick="showHistory()" data-tip="历史记录">🕘</button>
    <span class="sep"></span>
    <button onclick="toggleSidebar()" data-tip="侧边栏">☰</button>
    <span class="sep"></span>
    <button onclick="fmt('bold')" data-tip="粗体 Ctrl+B"><b>B</b></button>
    <button onclick="fmt('italic')" data-tip="斜体 Ctrl+I"><i>I</i></button>
    <button onclick="fmt('underline')" data-tip="下划线"><u>U</u></button>
    <button onclick="toggleTextColorPalette()" onmousedown="event.preventDefault()" id="textColorBtn" data-tip="文字颜色" aria-haspopup="menu" aria-expanded="false"><span style="font-weight:600">A</span><span style="font-size:9px">▾</span></button>
    <button onclick="fmt('strikeThrough')" data-tip="删除线"><s>S</s></button>
    <button onclick="fmt('insertUnorderedList')" data-tip="无序列表">•</button>
    <button onclick="fmt('insertOrderedList')" data-tip="有序列表">1.</button>
    <button onclick="insertChecklist()" data-tip="待办列表">☑</button>
    <span class="sep"></span>
    <button onclick="insertHeading(1)" data-tip="标题1">H1</button>
    <button onclick="insertHeading(2)" data-tip="标题2">H2</button>
    <button onclick="insertHeading(3)" data-tip="标题3">H3</button>
    <button onclick="insertHeading(4)" data-tip="标题4">H4</button>
    <button onclick="insertHeading(5)" data-tip="标题5">H5</button>
    <button onclick="insertHeading(6)" data-tip="标题6">H6</button>
    <span class="sep"></span>
    <button onclick="insertCodeBlock()" data-tip="代码块">&lt;/&gt;</button>
    <button onclick="insertLink()" data-tip="链接">🔗</button>
    <button onclick="insertImage()" data-tip="远程图片">🖼</button>
    <button onclick="insertQuote()" data-tip="引用">❝</button>
    <button onclick="insertTable()" data-tip="插入表格">▦</button>
    <button onclick="insertHR()" data-tip="分割线">―</button>
    <button onclick="insertMermaid()" data-tip="Mermaid图表">📊</button>
    <span class="sep"></span>
    <button onclick="toggleSource()" id="sourceBtn" data-tip="源码 Ctrl+/">源码</button>
    <button onclick="toggleContentWidth()" id="widthBtn" data-tip="内容宽度：标准（点击切换）" aria-label="内容宽度：标准">标准</button>
    <button onclick="toggleTheme()" id="themeBtn" data-tip="切换主题">🌙</button>
    <span class="spacer"></span>
    <span class="filename" id="filename">未打开文件</span>
  </div>

  <div class="main">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-tabs">
        <button class="active" onclick="switchTab('files')" id="tabFiles">文件</button>
        <button onclick="switchTab('outline')" id="tabOutline">大纲</button>
      </div>
      <div class="sidebar-content">
        <ul class="file-list" id="fileList"></ul>
        <ul class="outline-list" id="outlineList" style="display:none;"></ul>
      </div>
      <div class="sidebar-resize" id="sidebarResize"></div>
    </div>

    <div class="editor-wrapper" id="editorWrapper">
      <div id="editor" contenteditable="true" spellcheck="false">
        <div class="welcome">
          <div class="welcome-icon">📝</div>
          <h2>Markdown Editor</h2>
          <p>
            <kbd>Ctrl+O</kbd> 打开文件&emsp;
            <kbd>Ctrl+S</kbd> 保存&emsp;
            <kbd>Ctrl+/</kbd> 源码模式<br>
            <kbd>Ctrl+B</kbd> 粗体&emsp;
            <kbd>Ctrl+I</kbd> 斜体&emsp;
            拖放 .md 文件到窗口打开
          </p>
        </div>
      </div>
      <div class="source-panel">
        <textarea id="sourceEditor" spellcheck="false" placeholder="Markdown 源码..."></textarea>
      </div>
    </div>
  </div>

  <div class="status-bar">
    <span id="wordCount">字数: 0</span>
    <span id="lineCount">段落: 0</span>
    <span id="lastModified">更新时间: --</span>
    <span id="modifiedIndicator"></span>
    <span id="linkFileHint" onclick="relinkCurrentFile()" title="点击授权或重新选择文件，以启用外部修改实时更新" style="display:none;cursor:pointer;color:#b36b00;">⚠ 点击授权文件访问，启用实时更新</span>
  </div>
</div>

<input type="file" id="fileInput" accept=".md,.markdown,.txt" multiple style="display:none">

<!-- Mermaid engine (local file, offline capable) -->
<script src="js/context.js"></script>
<script src="mermaid.min.js" onload="_mermaidScriptLoaded=true;" onerror="_mermaidScriptError=true;"></script>
<script src="js/parser.js"></script>
<script src="js/history.js"></script>
<script src="js/editor.js"></script>
<script src="js/files.js"></script>
<script src="js/tables.js"></script>
<script src="js/clipboard.js"></script>
<script src="js/ui.js"></script>
<script src="js/bootstrap.js"></script>
</body>
</html>
