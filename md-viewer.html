<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown Editor</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%234a90d9'/><path d='M5 22V10h4l3 5 3-5h4v12h-4v-6l-3 4-3-4v6H5zm17-12v12h3l4-5v5h3V10h-3l-4 5v-5h-3z' fill='white'/></svg>">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', Roboto, sans-serif;
  background: #fff;
  color: #333;
  height: 100vh;
  overflow: hidden;
  transition: background 0.3s, color 0.3s;
}

/* Layout */
.app { display: flex; height: 100vh; flex-direction: column; }
.toolbar {
  height: 40px;
  background: #f6f6f6;
  border-bottom: 1px solid #e0e0e0;
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 4px;
  flex-shrink: 0;
  transition: background 0.3s, border-color 0.3s;
}
.toolbar button {
  padding: 5px 10px;
  border: none;
  border-radius: 3px;
  background: transparent;
  color: #555;
  cursor: pointer;
  font-size: 14px;
  transition: background 0.15s, color 0.15s;
  min-width: 32px;
  text-align: center;
  position: relative;
}
.toolbar button:hover { background: #e0e0e0; }
.toolbar button.active { background: #ddd; color: #111; }
.toolbar .sep { width: 1px; height: 20px; background: #ddd; margin: 0 6px; }
.toolbar .spacer { flex: 1; }
.toolbar .filename { font-size: 12px; color: #999; transition: color 0.3s; }
.toolbar .filename.modified::before { content: "● "; color: #f0a020; }

/* Custom tooltip */
.toolbar button[data-tip]::after {
  content: attr(data-tip);
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%) translateY(4px);
  background: #333;
  color: #fff;
  font-size: 11px;
  padding: 4px 8px;
  border-radius: 4px;
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
  z-index: 100;
}
.toolbar button[data-tip]:hover::after { opacity: 1; }

.main { display: flex; flex: 1; overflow: hidden; }

/* Sidebar */
.sidebar {
  width: 240px;
  min-width: 140px;
  max-width: 50vw;
  background: #f9f9f9;
  border-right: 1px solid #e0e0e0;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow: hidden;
  position: relative;
  transition: width 0.25s ease, opacity 0.25s ease, border-color 0.3s, background 0.3s;
}
.sidebar.hidden { width: 0; min-width: 0; border-right: none; opacity: 0; pointer-events: none; }
.sidebar.resizing { transition: none; }

/* Sidebar resize handle */
.sidebar-resize {
  position: absolute;
  top: 0;
  right: -3px;
  width: 6px;
  height: 100%;
  cursor: col-resize;
  z-index: 10;
  background: transparent;
  transition: background 0.15s;
}
.sidebar-resize:hover,
.sidebar-resize.active { background: rgba(65,131,196,0.3); }
body.dark .sidebar-resize:hover,
body.dark .sidebar-resize.active { background: rgba(109,179,248,0.3); }
body.eye-care .sidebar-resize:hover,
body.eye-care .sidebar-resize.active { background: rgba(90,154,90,0.3); }

.sidebar-tabs {
  display: flex;
  border-bottom: 1px solid #e0e0e0;
  background: #f0f0f0;
  transition: background 0.3s, border-color 0.3s;
}
.sidebar-tabs button {
  flex: 1;
  padding: 8px 4px;
  border: none;
  background: transparent;
  cursor: pointer;
  font-size: 12px;
  color: #666;
  border-bottom: 2px solid transparent;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.sidebar-tabs button.active { color: #333; border-bottom-color: #4183c4; background: #f9f9f9; }
.sidebar-tabs button:hover { background: #eee; }

.sidebar-content { flex: 1; overflow-y: auto; padding: 8px 0; }

/* File list */
.file-list { list-style: none; }
.file-list li {
  padding: 6px 14px;
  cursor: pointer;
  font-size: 13px;
  color: #555;
  display: flex;
  align-items: center;
  gap: 6px;
  border-left: 3px solid transparent;
  transition: background 0.15s, border-color 0.15s;
}
.file-list li:hover { background: #eee; }
.file-list li.active { background: #e8f0fe; border-left-color: #4183c4; color: #111; }
.file-list li .close-btn {
  margin-left: auto;
  opacity: 0;
  font-size: 14px;
  color: #999;
  padding: 0 4px;
  border-radius: 2px;
  transition: opacity 0.15s;
}
.file-list li:hover .close-btn { opacity: 1; }
.file-list li .close-btn:hover { background: #ddd; color: #333; }

/* Outline */
.outline-list { list-style: none; }
.outline-list li {
  padding: 4px 14px;
  cursor: pointer;
  font-size: 12px;
  color: #555;
  line-height: 1.6;
  border-radius: 2px;
  transition: background 0.15s;
}
.outline-list li:hover { background: #eee; color: #111; }
.outline-list li.h1 { padding-left: 14px; font-weight: 600; font-size: 13px; }
.outline-list li.h2 { padding-left: 26px; }
.outline-list li.h3 { padding-left: 38px; font-size: 11px; color: #777; }
.outline-list li.h4 { padding-left: 50px; font-size: 11px; color: #999; }
.outline-list li.h5 { padding-left: 62px; font-size: 10px; color: #999; }
.outline-list li.h6 { padding-left: 74px; font-size: 10px; color: #aaa; }
body.source-mode .minimap { display: none !important; }

/* Scrollbar */
.editor-wrapper::-webkit-scrollbar,
.sidebar-content::-webkit-scrollbar { width: 6px; }
.editor-wrapper::-webkit-scrollbar-track,
.sidebar-content::-webkit-scrollbar-track { background: transparent; }
.editor-wrapper::-webkit-scrollbar-thumb,
.sidebar-content::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 3px; }
.editor-wrapper::-webkit-scrollbar-thumb:hover,
.sidebar-content::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.3); }
body.dark .editor-wrapper::-webkit-scrollbar-thumb,
body.dark .sidebar-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); }
body.dark .editor-wrapper::-webkit-scrollbar-thumb:hover,
body.dark .sidebar-content::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

/* Editor area */
body.width-wide { --content-max-width: 1400px; }
body.width-full { --content-max-width: 100%; }
.editor-wrapper { flex: 1; overflow-y: auto; transition: background 0.3s; }
#editor {
  max-width: var(--content-max-width, 1000px);
  margin: 0 auto;
  padding: 24px 40px 120px;
  min-height: 100%;
  outline: none;
  line-height: 1.8;
  font-size: 15px;
}

/* Typography */
#editor h1 { font-size: 1.8em; font-weight: 700; margin: 0.6em 0 0.3em; padding-bottom: 0.15em; border-bottom: 1px solid #eee; color: #000; }
#editor h2 { font-size: 1.4em; font-weight: 600; margin: 0.6em 0 0.3em; padding-bottom: 0.1em; border-bottom: 1px solid #eee; color: #111; }
#editor h3 { font-size: 1.2em; font-weight: 600; margin: 0.5em 0 0.2em; color: #222; }
#editor h4 { font-size: 1.05em; font-weight: 600; margin: 0.4em 0 0.2em; color: #333; }
#editor p { margin: 0.4em 0; }
#editor a { color: #4183c4; text-decoration: none; }
#editor a:hover { text-decoration: underline; }
#editor strong, #editor b { font-weight: 600; }
#editor ul, #editor ol { padding-left: 1.8em; margin: 0.3em 0; }
#editor li { margin: 0.15em 0; }
#editor blockquote { border-left: 4px solid #ddd; padding: 0.3em 0.8em; margin: 0.5em 0; color: #666; background: #fafafa; border-radius: 0 4px 4px 0; }
#editor code { background: #f3f4f4; padding: 2px 5px; border-radius: 3px; font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; font-size: 0.88em; color: #e96900; }
#editor pre { background: #f8f8f8; border-radius: 6px; padding: 12px 16px; overflow-x: auto; margin: 0.5em 0; border: 1px solid #eee; position: relative; }
#editor pre code { background: none; padding: 0; color: #333; display: block; font-size: 0.85em; line-height: 1.5; }
#editor table { border-collapse: collapse; width: 100%; margin: 0.5em 0; table-layout: fixed; word-wrap: break-word; overflow-wrap: break-word; }
#editor th, #editor td { border: 1px solid #ddd; padding: 5px 10px; text-align: left; word-break: break-word; white-space: normal; }
#editor th { background: #f6f8fa; font-weight: 600; }
#editor img { max-width: 100%; border-radius: 2px; margin: 0.4em 0; cursor: zoom-in; transition: opacity 0.15s; }
#editor img:hover { opacity: 0.9; }
#editor hr { border: none; border-top: 1px solid #ddd; margin: 1em 0; }
#editor iframe { width: 100%; min-height: 400px; border: 1px solid #eee; border-radius: 4px; margin: 0.5em 0; }
#editor .mermaid-container { margin: 0.6em 0; padding: 12px; background: #fafafa; border: 1px solid #eee; border-radius: 4px; text-align: center; overflow-x: auto; }
#editor .mermaid-container svg { max-width: 100%; }
#editor .mermaid-container svg foreignObject,
#editor .mermaid-container svg foreignObject div,
#editor .mermaid-container svg foreignObject p,
#editor .mermaid-container svg foreignObject span {
  line-height: 1.3 !important;
  font-size: 14px !important;
  overflow: visible !important;
  white-space: normal !important;
  word-wrap: break-word !important;
}
#editor .codepen-container { margin: 0.6em 0; border-radius: 4px; overflow: hidden; max-width: 100%; }
#editor .codepen-container iframe { display: block; max-width: 100%; }

/* Code block enhancements */
#editor pre .code-lang-label {
  position: absolute;
  top: 0;
  right: 0;
  background: #e8e8e8;
  color: #666;
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 0 6px 0 4px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
#editor pre .code-copy-btn {
  position: absolute;
  top: 6px;
  right: 6px;
  background: rgba(0,0,0,0.06);
  border: none;
  border-radius: 4px;
  padding: 4px 8px;
  cursor: pointer;
  font-size: 11px;
  color: #666;
  opacity: 0;
  transition: opacity 0.2s, background 0.15s;
}
#editor pre:hover .code-copy-btn { opacity: 1; }
#editor pre .code-copy-btn:hover { background: rgba(0,0,0,0.12); }
#editor pre .code-copy-btn.copied { color: #28a745; }

/* Source mode */
body.source-mode #editor { display: none; }
body.source-mode .source-panel { display: block; }
.source-panel {
  display: none;
  max-width: var(--content-max-width, 1000px);
  margin: 0 auto;
  padding: 24px 40px 120px;
}
.source-panel textarea {
  width: 100%;
  min-height: calc(100vh - 160px);
  border: none;
  outline: none;
  resize: none;
  font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace;
  font-size: 14px;
  line-height: 1.8;
  color: #333;
  background: transparent;
  tab-size: 4;
}

/* Status bar */
.status-bar {
  height: 24px;
  background: #f6f6f6;
  border-top: 1px solid #e0e0e0;
  display: flex;
  align-items: center;
  padding: 0 16px;
  font-size: 11px;
  color: #999;
  gap: 16px;
  flex-shrink: 0;
  transition: background 0.3s, border-color 0.3s;
}

/* Drag overlay */
.drag-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(65,131,196,0.08);
  border: 2px dashed #4183c4;
  z-index: 1000;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: #4183c4;
}
.drag-overlay.active { display: flex; }

/* Welcome screen */
.welcome {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 60vh;
  color: #999;
  text-align: center;
  user-select: none;
}
.welcome .welcome-icon { font-size: 64px; margin-bottom: 16px; opacity: 0.5; }
.welcome h2 { font-size: 20px; font-weight: 500; color: #666; margin-bottom: 12px; }
.welcome p { font-size: 14px; line-height: 2; color: #999; }
.welcome kbd {
  display: inline-block;
  padding: 2px 6px;
  font-size: 12px;
  font-family: inherit;
  background: #f0f0f0;
  border: 1px solid #ddd;
  border-radius: 3px;
  box-shadow: 0 1px 0 #ccc;
  color: #555;
}

/* Responsive */
@media (max-width: 900px) {
  #editor { padding: 20px 24px 120px; }
  .source-panel { padding: 20px 24px 120px; }
}
@media (max-width: 640px) {
  #editor { padding: 16px 12px 100px; }
  .source-panel { padding: 16px 12px 100px; }
  .sidebar { position: fixed; top: 40px; left: 0; bottom: 24px; z-index: 50; width: 240px; box-shadow: 2px 0 8px rgba(0,0,0,0.15); }
  .sidebar.hidden { width: 0; box-shadow: none; }
  .toolbar { gap: 2px; padding: 0 6px; }
  .toolbar button { min-width: 28px; padding: 5px 6px; font-size: 13px; }
  .toolbar .sep { margin: 0 3px; }
}

/* Minimap progress (right side) */
.minimap {
  position: fixed;
  top: 40px;
  right: 0;
  width: 40px;
  bottom: 24px;
  z-index: 55;
  overflow: hidden;
}
.minimap-content {
  width: 100%;
  height: 100%;
  position: relative;
  opacity: 0;
  transition: opacity 0.3s;
}
.minimap:hover .minimap-content,
.minimap.active .minimap-content { opacity: 1; }
.minimap-track {
  position: absolute;
  top: 0;
  right: 4px;
  width: 32px;
  height: 100%;
  background: rgba(0,0,0,0.03);
  border-radius: 3px;
}
.minimap-thumb {
  position: absolute;
  right: 4px;
  width: 32px;
  min-height: 20px;
  background: rgba(65,131,196,0.2);
  border: 1px solid rgba(65,131,196,0.35);
  border-radius: 3px;
  cursor: pointer;
  pointer-events: auto;
  transition: background 0.15s;
}
.minimap-thumb:hover { background: rgba(65,131,196,0.35); }
.minimap-thumb:active { background: rgba(65,131,196,0.5); }
.minimap-markers {
  position: absolute;
  top: 0;
  right: 4px;
  width: 32px;
  height: 100%;
}
.minimap-markers .marker {
  position: absolute;
  right: 2px;
  width: 28px;
  height: 2px;
  background: rgba(0,0,0,0.15);
  border-radius: 1px;
}
.minimap-markers .marker.h1 { background: rgba(0,0,0,0.4); height: 3px; }
.minimap-markers .marker.h2 { background: rgba(0,0,0,0.25); }

body.dark .minimap-track { background: rgba(255,255,255,0.03); }
body.dark .minimap-thumb { background: rgba(109,179,248,0.2); border-color: rgba(109,179,248,0.35); }
body.dark .minimap-thumb:hover { background: rgba(109,179,248,0.35); }
body.dark .minimap-thumb:active { background: rgba(109,179,248,0.5); }
body.dark .minimap-markers .marker { background: rgba(255,255,255,0.12); }
body.dark .minimap-markers .marker.h1 { background: rgba(255,255,255,0.35); }
body.dark .minimap-markers .marker.h2 { background: rgba(255,255,255,0.2); }

body.eye-care .minimap-track { background: rgba(0,80,0,0.03); }
body.eye-care .minimap-thumb { background: rgba(90,154,90,0.2); border-color: rgba(90,154,90,0.35); }
body.eye-care .minimap-thumb:hover { background: rgba(90,154,90,0.35); }
body.eye-care .minimap-markers .marker { background: rgba(0,80,0,0.12); }
body.eye-care .minimap-markers .marker.h1 { background: rgba(0,80,0,0.35); }
body.eye-care .minimap-markers .marker.h2 { background: rgba(0,80,0,0.2); }

/* Back to top button */
.back-to-top {
  position: fixed;
  bottom: 40px;
  right: 24px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: #4183c4;
  color: #fff;
  border: none;
  cursor: pointer;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.3s, transform 0.3s, background 0.15s;
  pointer-events: none;
  z-index: 60;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.back-to-top.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
.back-to-top:hover { background: #3070b0; }
body.dark .back-to-top { background: #6db3f8; color: #1e1e1e; }
body.dark .back-to-top:hover { background: #8ac4ff; }
body.eye-care .back-to-top { background: #5a9a5a; }
body.eye-care .back-to-top:hover { background: #4a8a4a; }

/* Outline active tracking */
.outline-list li.active-heading { background: #e8f0fe; color: #111; font-weight: 500; }
body.dark .outline-list li.active-heading { background: #37373d; color: #fff; }
body.eye-care .outline-list li.active-heading { background: #cce5cc; color: #1a3a1a; }

/* Image lightbox */
.lightbox-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.85);
  z-index: 2000;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: zoom-out;
  opacity: 0;
  transition: opacity 0.25s;
  pointer-events: none;
}
.lightbox-overlay.active { opacity: 1; pointer-events: auto; }
.lightbox-overlay img {
  max-width: 92vw;
  max-height: 92vh;
  border-radius: 4px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.4);
  transform: scale(0.9);
  transition: transform 0.25s;
}
.lightbox-overlay.active img { transform: scale(1); }

/* File browser modal */
.fb-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.4);
  z-index: 2100;
  display: none;
  align-items: center;
  justify-content: center;
}
.fb-overlay.active { display: flex; }
.fb-dialog {
  width: 560px;
  max-width: 92vw;
  height: 560px;
  max-height: 85vh;
  background: #fff;
  border-radius: 8px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.3);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.fb-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  font-size: 14px;
  font-weight: 600;
  border-bottom: 1px solid #eee;
}
.fb-close {
  border: none; background: transparent; font-size: 20px; cursor: pointer; color: #999;
  width: 28px; height: 28px; border-radius: 4px; line-height: 1;
}
.fb-close:hover { background: #eee; color: #333; }
.fb-path {
  display: flex; gap: 6px; padding: 10px 16px; border-bottom: 1px solid #eee; align-items: center;
}
.fb-path input {
  flex: 1; padding: 6px 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; outline: none;
}
.fb-path input:focus { border-color: #4183c4; }
.fb-up, .fb-drives {
  border: 1px solid #ddd; background: #f6f6f6; border-radius: 4px; cursor: pointer;
  width: 30px; height: 30px; font-size: 14px; flex-shrink: 0;
}
.fb-up:hover, .fb-drives:hover { background: #e8e8e8; }
.fb-list { flex: 1; overflow-y: auto; padding: 6px 0; }
.fb-item {
  display: flex; align-items: center; gap: 8px; padding: 7px 16px; cursor: pointer; font-size: 13px; color: #444;
}
.fb-item:hover { background: #eef4fc; }
.fb-item .fb-icon { width: 18px; text-align: center; flex-shrink: 0; }
.fb-item.fb-dir { font-weight: 500; }
.fb-empty { padding: 20px 16px; color: #999; font-size: 13px; text-align: center; }

body.dark .fb-dialog { background: #2a2a2a; color: #ddd; }
body.dark .fb-header, body.dark .fb-path { border-color: #444; }
body.dark .fb-path input { background: #1e1e1e; border-color: #444; color: #ddd; }
body.dark .fb-up, body.dark .fb-drives { background: #3a3a3a; border-color: #555; color: #ddd; }
body.dark .fb-item { color: #ccc; }
body.dark .fb-item:hover { background: #37373d; }
body.dark .fb-close:hover { background: #444; color: #fff; }
body.eye-care .fb-dialog { background: #f0f8f0; color: #2d3b2d; }
body.eye-care .fb-item:hover { background: #d8ecd8; }

/* History modal */
.history-dialog { width: 1000px; height: 700px; }
.history-header-actions { display: flex; align-items: center; gap: 8px; }
.history-clear { border: 1px solid #ddd; background: transparent; color: #777; padding: 4px 9px; border-radius: 4px; cursor: pointer; }
.history-clear:hover { background: #f5e3e3; color: #b33; }
.history-body { display: flex; flex: 1; min-height: 0; }
#historyList { width: 42%; flex: none; border-right: 1px solid #eee; }
.history-item { padding: 11px 14px; border-bottom: 1px solid #eee; cursor: pointer; }
.history-item:hover { background: #f8fbff; }
.history-item.active { background: #e8f0fe; box-shadow: inset 3px 0 #4183c4; }
.history-meta { font-size: 12px; color: #888; }
.history-reason { color: #333; font-weight: 600; margin-left: 8px; }

function loadMermaidLib() {
  if (typeof mermaid !== 'undefined') {
    mermaidLoaded = true;
    return Promise.resolve();
  }
  // If script tag loaded OK but mermaid not defined, it's a JS error in the file - won't help retrying
  if (_mermaidScriptLoaded && typeof mermaid === 'undefined') {
    return Promise.reject(new Error('mermaid.min.js 执行出错 (JS error in file)'));
  }
  // Try dynamic load as last resort
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = 'mermaid.min.js?t=' + Date.now();
    script.onload = () => {
      if (typeof mermaid !== 'undefined') {
        mermaidLoaded = true;
        mermaidFailed = false;
        try { mermaid.initialize({ startOnLoad: false, theme: isDark ? 'dark' : 'default', securityLevel: 'loose' }); } catch(e) {}

        mermaidFailed = true;

      mermaidFailed = true;

const importedCssColorProbe = document.createElement('span');
function normalizeImportedCssBackground(value) {

  normalized = normalized.replace(/^light(red|orange|yellow|green|blue|purple|gray)$/, 'light-$1');

function getImportedBackgroundDescriptor(element) {

function escHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// Inline formatting: bold, italic, code, links, images, strikethrough
function parseInline(text) {
  let s = text;
  // Protect inline code before escaping so its contents are escaped exactly once.
  const codeStore = [];
  s = s.replace(/`([^`]+)`/g, (m, c) => {
    codeStore.push(c);
    return '\u0000CODE' + (codeStore.length - 1) + '\u0000';
  });
  // Escape HTML first (but we'll re-insert our own safe tags).
  s = s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // Allow only attribute-free HTML line breaks/underline tags and Feishu's fixed text palette.
  // Inline-code content is already protected, so literal examples remain text.
  s = s.replace(/&lt;br[ \t]*\/?&gt;/gi, '<br>');
  s = s.replace(/&lt;(\/?)u&gt;/gi, '<$1u>');
  s = s.replace(/&lt;span\s+text-color\s*=\s*(["'])(red|orange|yellow|green|blue|purple|gray)\1\s*&gt;/gi,
    (match, quote, token) => '<span text-color="' + token.toLowerCase() + '">');
  s = s.replace(/&lt;\/span\s*&gt;/gi, '</span>');
  // Images ![alt](url)
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, (m, alt, url) =>
    '<img src="' + url + '" alt="' + alt + '">');
  // Links [text](url)
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g, (m, txt, url) =>
    '<a href="' + url + '" target="_blank" rel="noopener">' + txt + '</a>');
  // Bold **text** or __text__
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  // Italic *text* or _text_
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/(^|[^_])_([^_\n]+)_/g, '$1<em>$2</em>');
  // Strikethrough ~~text~~
  s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  // Restore inline code
  s = s.replace(/\u0000CODE(\d+)\u0000/g, (m, i) =>
    '<code>' + escHtml(codeStore[+i]) + '</code>');
  return s;
}

    // Fenced code block. Accept common info strings such as c++, vue.js,
    // "mermaid title=..." and attribute syntax like {.mermaid}.
    const fence = line.match(/^(\s*)(`{3,}|~{3,})[ \t]*(.*)$/);
    if (fence) {
      const marker = fence[2][0];
      const info = (fence[3] || '').trim();
      const attributeLang = info.match(/^\{\s*\.([\w-]+)/);
      const tokenLang = info.match(/^([^\s{]+)/);
      const lang = attributeLang ? attributeLang[1] : (tokenLang ? tokenLang[1] : '');
      const normalizedLang = lang.toLowerCase();
      const safeLangClass = lang.replace(/[^\w-]/g, '-');
      const codeLines = [];
      i++;
      while (i < lines.length && !lines[i].match(new RegExp('^\\s*' + marker + '{3,}\\s*$'))) {
        codeLines.push(lines[i]);
        i++;
      }
      if (i < lines.length) i++; // skip closing fence when present
      const code = codeLines.join('\n');
      if (normalizedLang === 'mermaid') {
        mermaidId++;
        html += '<div class="mermaid-container" contenteditable="false" data-mermaid-source="' +
          encodeURIComponent(code) + '"><div class="mermaid" id="mermaid-' + mermaidId + '">' +
          escHtml(code) + '</div></div>';
      } else if (normalizedLang === 'codepen') {
        html += '<div class="codepen-container" contenteditable="false" data-codepen-source="' +
          encodeURIComponent(code) + '"><iframe sandbox="allow-scripts allow-same-origin" style="width:100%;max-width:100%;min-height:500px;border:none;border-radius:4px;"></iframe></div>';
      } else {
        const langLabel = lang ? '<span class="code-lang-label">' + escHtml(lang) + '</span>' : '';
        const copyBtn = '<button class="code-copy-btn" onclick="copyCode(this)" contenteditable="false">复制</button>';
        html += '<pre>' + langLabel + copyBtn + '<code class="language-' + safeLangClass + '">' +
          escHtml(code) + '</code></pre>';
      }
      continue;
    }

    // Raw HTML table. Support complete/multiline <table> blocks and fragments
    // that start with <thead>, <tbody> or <tr> but end with </table>.
    const rawTableStart = line.match(/^\s*<(table|thead|tbody|tr)\b/i);
    if (rawTableStart) {
      const tableLines = [];
      let openCellDepth = 0;
      while (i < lines.length) {
        const tableLine = lines[i];
        const trimmedTableLine = tableLine.trim();
        if (tableLines.length > 0) {
          if (trimmedTableLine === '') break;
          const previousLine = tableLines[tableLines.length - 1].trim();
          const completedTableUnit = /<\/(?:thead|tbody|tfoot|tr)>\s*$/i.test(previousLine);
          const tableContinuation = /^<\/?(?:table|caption|colgroup|col|thead|tbody|tfoot|tr|th|td)\b/i.test(trimmedTableLine);
          const markdownBlockStart = /^(?:#{1,6}\s+|>\s*|[-*+]\s+|\d+[.)]\s+|`{3,}|~{3,}|\|)/.test(trimmedTableLine);
          if (openCellDepth === 0 && (markdownBlockStart || (completedTableUnit && !tableContinuation))) break;
        }
        tableLines.push(tableLine);
        i++;
        const openingCells = (tableLine.match(/<(?:td|th)\b/gi) || []).length;
        const closingCells = (tableLine.match(/<\/(?:td|th)>/gi) || []).length;
        openCellDepth = Math.max(0, openCellDepth + openingCells - closingCells);
        if (/<\/table>\s*$/i.test(tableLine)) break;
      }
      let rawTable = tableLines.join('\n');
      if (rawTableStart[1].toLowerCase() !== 'table') {
        rawTable = rawTable.replace(/<\/table>\s*$/i, '');
        rawTable = '<table data-md-raw-table="1">' + rawTable + '</table>';
      } else if (!/^\s*<table\b[^>]*\bdata-md-raw-table=/i.test(rawTable)) {
        rawTable = rawTable.replace(/<table\b/i, '<table data-md-raw-table="1"');
      }
      html += rawTable;
      continue;
    }

    // Other raw HTML blocks - pass through
    if (line.match(/^\s*<(iframe|div|img|details|summary|hr|br)/i)) {
      html += line + '\n';
      i++;
      continue;
    }

    // Heading
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      const level = h[1].length;
      html += '<h' + level + '>' + parseInline(h[2].trim()) + '</h' + level + '>';
      i++;
      continue;
    }

    // Horizontal rule
    if (line.match(/^\s*([-*_])\s*(\1\s*){2,}$/)) {
      html += '<hr>';
      i++;
      continue;
    }

    // Blockquote
    if (line.match(/^\s*>/)) {
      const quoteLines = [];
      while (i < lines.length && lines[i].match(/^\s*>/)) {
        quoteLines.push(lines[i].replace(/^\s*>\s?/, ''));
        i++;
      }
      html += '<blockquote>' + mdToHtml(quoteLines.join('\n')) + '</blockquote>';
      continue;
    }

    // Table (must have header + separator line)
    if (line.indexOf('|') >= 0 && i + 1 < lines.length &&
        lines[i + 1].match(/^\s*\|?[\s:]*-+[\s:|-]*$/)) {
      const header = parseTableRow(line);
      const align = parseTableRow(lines[i + 1]).map(c => {
        if (/^:.*:$/.test(c)) return 'center';
        if (/:$/.test(c)) return 'right';
        if (/^:/.test(c)) return 'left';
        return '';
      });
      i += 2;
      let tbl = '<table><thead><tr>';
      header.forEach((c, idx) => {
        const a = align[idx] ? ' style="text-align:' + align[idx] + '"' : '';
        tbl += '<th' + a + '>' + parseInline(c) + '</th>';
      });
      tbl += '</tr></thead><tbody>';
      while (i < lines.length && lines[i].indexOf('|') >= 0 && lines[i].trim() !== '') {
        const row = parseTableRow(lines[i]);
        tbl += '<tr>';
        row.forEach((c, idx) => {
          const a = align[idx] ? ' style="text-align:' + align[idx] + '"' : '';
          tbl += '<td' + a + '>' + parseInline(c) + '</td>';
        });
        tbl += '</tr>';
        i++;
      }
      tbl += '</tbody></table>';
      html += tbl;
      continue;
    }

    // Lists (unordered / ordered / task)
    if (line.match(/^\s*([-*+]|\d+\.)\s+/)) {
      const result = parseList(lines, i, getIndent(line));
      html += result.html;
      i = result.next;
      continue;
    }

    // Blank line
    if (line.trim() === '') { i++; continue; }

    // Paragraph (collect consecutive non-blank, non-special lines)
    const paraLines = [];
    while (i < lines.length && lines[i].trim() !== '' &&
           !lines[i].match(/^(#{1,6})\s/) &&
           !lines[i].match(/^\s*([-*_])\s*(\1\s*){2,}$/) &&
           !lines[i].match(/^\s*>/) &&
           !lines[i].match(/^(\s*)(`{3,}|~{3,})/) &&
           !lines[i].match(/^\s*([-*+]|\d+\.)\s+/) &&
           !(lines[i].indexOf('|') >= 0 && i + 1 < lines.length && lines[i+1].match(/^\s*\|?[\s:]*-+[\s:|-]*$/)) &&
           !lines[i].match(/^\s*<(iframe|div|table|img|details|summary|hr)/i)) {
      paraLines.push(lines[i]);
      i++;
    }
    if (paraLines.length > 0) {
      html += '<p>' + parseInline(paraLines.join('\n').trim()).replace(/\n/g, '<br>') + '</p>';
    } else {
      // Defensive progress guarantee: no malformed or newly supported syntax may
      // leave the parser retrying the same line forever.
      html += '<p>' + parseInline(line.trim()) + '</p>';
      i++;
    }
  }
  return html;
}

function getIndent(line) {
  const m = line.match(/^(\s*)/);
  return m ? m[1].length : 0;
}

// Parse a list starting at index `start`. Returns {html, next}
function isOrderedMarker(line) { return /^\s*\d+\.\s/.test(line); }

function parseList(lines, start, baseIndent) {
  const ordered = isOrderedMarker(lines[start]);
  const tag = ordered ? 'ol' : 'ul';
  let isTask = false;
  let items = [];
  let i = start;

  while (i < lines.length) {
    const line = lines[i];
    if (line.trim() === '') {
      // Blank line: continue only if next non-blank is a SAME-TYPE list item at this indent
      let j = i + 1;
      while (j < lines.length && lines[j].trim() === '') j++;
      if (j < lines.length &&
          lines[j].match(/^\s*([-*+]|\d+\.)\s+/) &&
          getIndent(lines[j]) === baseIndent &&
          isOrderedMarker(lines[j]) === ordered) {
        i = j;
        continue;
      }
      break;
    }
    const indent = getIndent(line);
    const m = line.match(/^\s*([-*+]|\d+\.)\s+(.*)$/);
    if (!m || indent < baseIndent) break;

    if (indent > baseIndent) {
      // Nested list - attach to previous item
      const sub = parseList(lines, i, indent);
      if (items.length > 0) items[items.length - 1].content += sub.html;
      i = sub.next;
      continue;
    }

    // Same indent but different list type (ordered vs unordered) -> new list, stop here
    if (isOrderedMarker(line) !== ordered) break;

    let content = m[2];
    // Task list detection
    const task = content.match(/^\[([ xX])\]\s+(.*)$/);
    if (task) {
      isTask = true;
      const checked = task[1].toLowerCase() === 'x';
      content = '<input type="checkbox"' + (checked ? ' checked' : '') + '> ' + parseInline(task[2]);
    } else {
      content = parseInline(content);
    }
    items.push({ content: content });
    i++;
  }

  let html = '<' + tag + (isTask ? ' class="task-list"' : '') + '>';
  items.forEach(it => { html += '<li>' + it.content + '</li>'; });
  html += '</' + tag + '>';
  return { html: html, next: i };
}

// Lightweight HTML -> Markdown (only needed for WYSIWYG save; basic support)
function htmlToMarkdown(html) {
  // For our use case, content is stored as source markdown, so this is rarely needed.
  // Provide a basic conversion as fallback.
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  return domToMd(tmp).trim();
}

function getFeishuTextColorTokenFromValue(value) {
  const normalized = String(value || '').trim().toLowerCase().replace(/\s+/g, '');
  if (!normalized) return '';
  for (const [token, hex] of Object.entries(FEISHU_TEXT_COLORS)) {
    const red = parseInt(hex.slice(1, 3), 16);
    const green = parseInt(hex.slice(3, 5), 16);
    const blue = parseInt(hex.slice(5, 7), 16);
    if (normalized === hex || normalized === `rgb(${red},${green},${blue})` || normalized === `rgba(${red},${green},${blue},1)`) return token;
  }
  return '';
}

function getElementTextColorToken(element) {
  const attributeToken = (element.getAttribute('text-color') || '').toLowerCase();
  if (FEISHU_TEXT_COLORS[attributeToken]) return attributeToken;
  return getFeishuTextColorTokenFromValue(element.getAttribute('color') || element.style.color);
}

function normalizeTextColorMarkup(root) {
  root.querySelectorAll('font[color],span[text-color],span[style*="color"]').forEach(element => {
    const token = getElementTextColorToken(element);
    if (!token) return;
    if (element.tagName === 'FONT') {
      const span = document.createElement('span');
      span.setAttribute('text-color', token);
      while (element.firstChild) span.appendChild(element.firstChild);
      element.replaceWith(span);
      return;
    }
    element.setAttribute('text-color', token);
    element.removeAttribute('color');
    element.style.removeProperty('color');
    if (!element.getAttribute('style')) element.removeAttribute('style');
  });
}

function domToMd(node) {
  let md = '';
  node.childNodes.forEach(child => {
    if (child.nodeType === 3) { md += child.textContent; return; }
    if (child.nodeType !== 1) return;
    const tag = child.tagName.toLowerCase();
    if (tag === 'h1') md += '\n# ' + domToMd(child) + '\n\n';
    else if (tag === 'h2') md += '\n## ' + domToMd(child) + '\n\n';
    else if (tag === 'h3') md += '\n### ' + domToMd(child) + '\n\n';
    else if (tag === 'h4') md += '\n#### ' + domToMd(child) + '\n\n';
    else if (tag === 'h5') md += '\n##### ' + domToMd(child) + '\n\n';
    else if (tag === 'h6') md += '\n###### ' + domToMd(child) + '\n\n';
    else if (tag === 'p') md += '\n' + domToMd(child) + '\n\n';
    else if (tag === 'strong' || tag === 'b') md += '**' + domToMd(child) + '**';
    else if (tag === 'em' || tag === 'i') md += '*' + domToMd(child) + '*';
    else if (tag === 'u') md += '<u>' + domToMd(child) + '</u>';
    else if (tag === 'del') md += '~~' + domToMd(child) + '~~';
    else if (tag === 'span' || tag === 'font') {
      const token = getElementTextColorToken(child);
      md += token ? '<span text-color="' + token + '">' + domToMd(child) + '</span>' : domToMd(child);
    }
    else if (tag === 'code' && child.parentElement.tagName !== 'PRE') md += '`' + child.textContent + '`';
    else if (tag === 'a') md += '[' + child.textContent + '](' + (child.getAttribute('href') || '') + ')';
    else if (tag === 'img') md += '![' + (child.getAttribute('alt') || '') + '](' + (child.getAttribute('src') || '') + ')';
    else if (tag === 'br') md += '\n';
    else if (tag === 'hr') md += '\n---\n\n';
    else if (tag === 'blockquote') md += '\n> ' + domToMd(child).trim().replace(/\n/g, '\n> ') + '\n\n';
    else if (tag === 'ul' || tag === 'ol') {
      child.querySelectorAll(':scope > li').forEach((li, idx) => {
        const checkbox = li.querySelector(':scope > input[type="checkbox"]');
        let prefix = tag === 'ol' ? (idx + 1) + '. ' : '- ';
        const content = li.cloneNode(true);
        const clonedCheckbox = content.querySelector(':scope > input[type="checkbox"]');
        if (checkbox) {
          prefix = '- [' + (checkbox.checked ? 'x' : ' ') + '] ';
          if (clonedCheckbox) clonedCheckbox.remove();
        }
        md += prefix + domToMd(content).trim() + '\n';
      });
      md += '\n';
    }
    else if (tag === 'pre') {
      const codeEl = child.querySelector('code');
      const cls = codeEl ? (codeEl.className || '') : '';
      const lm = cls.match(/language-([\w-]+)/);
      const lang = lm ? lm[1] : '';
      md += '\n```' + lang + '\n' + (codeEl ? codeEl.textContent : child.textContent) + '\n```\n\n';
    }
    else if (child.classList && child.classList.contains('mermaid-container')) {
      const src = decodeURIComponent(child.getAttribute('data-mermaid-source') || '');
      md += '\n```mermaid\n' + src + '\n```\n\n';
    }
    else if (child.classList && child.classList.contains('codepen-container')) {
      const src = decodeURIComponent(child.getAttribute('data-codepen-source') || '');
      md += '\n```codepen\n' + src + '\n```\n\n';
    }
    else if (tag === 'iframe') md += '\n' + child.outerHTML + '\n\n';
    else if (tag === 'table') md += domTableToMd(child);
    else md += domToMd(child);
  });
  return md;
}

function cloneTableForExport(table) {
  const clone = table.cloneNode(true);
  clone.removeAttribute('data-md-raw-table');
  clone.querySelectorAll('script,iframe,object,embed,form,meta,link,style').forEach(element => element.remove());
  clone.querySelectorAll('*').forEach(element => {
    element.classList.remove('table-cell-selected');
    if (!element.className) element.removeAttribute('class');
    element.removeAttribute('contenteditable');
    element.removeAttribute('data-md-raw-table');
    Array.from(element.attributes).forEach(attribute => {
      if (attribute.name.toLowerCase().startsWith('on')) element.removeAttribute(attribute.name);
    });
    ['href', 'src'].forEach(name => {
      const value = element.getAttribute(name) || '';
      if (/^\s*javascript:/i.test(value)) element.removeAttribute(name);
    });
  });
  return clone;
}

function domTableToMd(table) {
  const preserveAsHtml = table.dataset.mdRawTable === '1' ||
    Array.from(table.querySelectorAll('th,td')).some(cell => cell.colSpan > 1 || cell.rowSpan > 1);
  if (preserveAsHtml) {
    return '\n' + cloneTableForExport(table).outerHTML + '\n\n';
  }

  let md = '\n';
  const rows = table.querySelectorAll('tr');
  rows.forEach((tr, ri) => {
    const cells = tr.querySelectorAll('th,td');
    const values = Array.from(cells).map(cell =>
      domToMd(cell).trim().replace(/\n/g, '<br>')
    );
    md += '| ' + values.join(' | ') + ' |\n';
    if (ri === 0) {
      md += '| ' + Array.from(cells).map(() => '---').join(' | ') + ' |\n';
    }
  });
  return md + '\n';
}

// Modified state tracking
function formatLastModified(value) {
  const date = new Date(Number(value));
  if (!value || Number.isNaN(date.getTime())) return '--';
  const pad = number => String(number).padStart(2, '0');
  return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate()) + ' ' +
    pad(date.getHours()) + ':' + pad(date.getMinutes()) + ':' + pad(date.getSeconds());
}

function serverMtimeToMilliseconds(value) {
  const ticks = Number(value);
  if (!Number.isFinite(ticks)) return null;
  return Math.floor(ticks / 10000 - 62135596800000);
}

async function getHandleLastModified(handle) {
  try {
    return (await handle.getFile()).lastModified;
  } catch (e) {
    return Date.now();
  }
}

function updateLastModifiedDisplay() {
  const current = activeFileIndex >= 0 ? openFiles[activeFileIndex] : null;
  lastModifiedEl.textContent = '更新时间: ' + formatLastModified(current && current.lastModified);
}

function markModified() {
  updateLastModifiedDisplay();
  if (activeFileIndex < 0) return;
  const current = openFiles[activeFileIndex];
  const currentContent = isSourceMode ? sourceEditor.value : current.content;
  if (currentContent !== current.savedContent) {
    if (!isModified) {
      isModified = true;
      filenameEl.classList.add('modified');
      modifiedEl.textContent = '已修改';
    }
  } else {
    if (isModified) {
      isModified = false;
      filenameEl.classList.remove('modified');
      modifiedEl.textContent = '';
    }
  }
}

function markSaved(lastModified) {
  isModified = false;
  filenameEl.classList.remove('modified');
  modifiedEl.textContent = '';
  if (activeFileIndex >= 0) {
    openFiles[activeFileIndex].savedContent = openFiles[activeFileIndex].content;
    if (lastModified !== undefined && lastModified !== null) {
      openFiles[activeFileIndex].lastModified = lastModified;
    }
  }
  updateLastModifiedDisplay();
}

function normalizeMarkdownBeforeRender(md) {
  return md.replace(
    /^(https:\/\/codepen\.io\/([\w-]+)\/pen\/([\w-]+))\s*$/gm,
    '<iframe src="https://codepen.io/$2/embed/$3?default-tab=result&theme-id=dark" style="width:100%;min-height:400px;" frameborder="0" allowfullscreen></iframe>'
  );
}

// Load markdown
function loadMarkdown(md) {
  hideTableCellTools();
  hideTextColorPalette();
  savedTextColorRange = null;
  lastEditorSelectionRange = null;
  clearCellBackgroundHistory();
  cancelDeferredPreviewFlush();
  previewDirty = false;
  mermaidId = 0;
  if (observerResumeTimer) clearTimeout(observerResumeTimer);
  observerPaused = true;
  md = normalizeMarkdownBeforeRender(md);
  editorEl.innerHTML = mdToHtml(md);
  renderMermaid();
  renderCodepen();
  updateOutline();
  updateCounts();
  enhanceRenderedContent();
  setTimeout(scheduleMinimapRefresh, 0);
  observerResumeTimer = setTimeout(() => {
    observerPaused = false;
    observerResumeTimer = null;
  }, 200);
}

function renderCodepen() {
  const containers = editorEl.querySelectorAll('.codepen-container');
  containers.forEach(container => {
    const htmlContent = decodeURIComponent(container.getAttribute('data-codepen-source') || '');
    if (!htmlContent) return;
    const iframe = container.querySelector('iframe');
    if (!iframe) return;
    const doc = iframe.contentDocument || iframe.contentWindow.document;
    doc.open();
    doc.write(htmlContent);
    doc.close();
    setTimeout(() => {
      try {
        const h = iframe.contentDocument.documentElement.scrollHeight;
        if (h > 100) iframe.style.height = Math.min(h + 20, 800) + 'px';
      } catch(e) {}
    }, 500);
  });
}

async function renderMermaid() {
  const containers = editorEl.querySelectorAll('.mermaid-container');
  if (containers.length === 0) return;
  try {
    await loadMermaidLib();
  } catch (e) {
    // Offline / mermaid unavailable - show the source code instead of hanging
    observerPaused = true;
    for (const container of containers) {
      const el = container.querySelector('.mermaid');
      if (!el || el.querySelector('svg') || el.querySelector('pre')) continue;
      const source = container.getAttribute('data-mermaid-source');
      let code = source ? decodeURIComponent(source) : el.textContent;
      el.innerHTML = '<pre style="text-align:left;font-size:12px;opacity:0.8;margin:0;">' +
        escHtml(code) + '</pre><div style="font-size:11px;color:#999;margin-top:6px;">（' + escHtml(e.message || 'mermaid.min.js 加载失败') + '）</div>';
    }
    observerPaused = false;
    return;
  }
  observerPaused = true;
  for (const container of containers) {
    const el = container.querySelector('.mermaid');
    if (!el) continue;
    if (el.querySelector('svg')) continue; // already rendered
    const source = container.getAttribute('data-mermaid-source');
    let code = source ? decodeURIComponent(source) : el.textContent.trim();
    code = code.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
    if (!code) continue;
    try {
      const uniqueId = 'mermaid-render-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
      if (typeof mermaid === 'undefined') throw new Error('mermaid is not loaded');
      const { svg } = await mermaid.render(uniqueId, code);
      el.innerHTML = svg;
    } catch (e) {
      el.innerHTML = '<pre style="color:red;font-size:12px;">Mermaid error: ' + e.message + '</pre>';
    }
  }
  observerPaused = false;
}

function getMarkdown() {
  // Prefer stored source markdown; fall back to HTML->MD conversion
  if (activeFileIndex >= 0 && openFiles[activeFileIndex]) {
    return openFiles[activeFileIndex].content;
  }
  return htmlToMarkdown(editorEl.innerHTML);
}

// File management
function openFile() {
  if (isServerMode) {
    openFileFromServerList();
  } else {
    openFileModern();
  }
}

fileInput.addEventListener('change', (e) => {
  const files = Array.from(e.target.files);
  files.forEach(file => addFile(file));
  fileInput.value = '';
});

function addFile(file) {
  const reader = new FileReader();
  reader.onload = (ev) => {
    const existing = openFiles.findIndex(f => f.name === file.name);
    if (existing >= 0) {
      openFiles[existing].content = ev.target.result;
      openFiles[existing].savedContent = ev.target.result;
      openFiles[existing].lastModified = file.lastModified;
      openFiles[existing].fileSize = file.size;
      switchFile(existing);
      return;
    }
    openFiles.push({ name: file.name, content: ev.target.result, savedContent: ev.target.result, handle: null, lastModified: file.lastModified, fileSize: file.size });
    switchFile(openFiles.length - 1);
    renderFileList();
  };
  reader.readAsText(file);
}

function applyReloadedContent(current, content, lastModified, fileSize) {
  current.content = content;
  current.savedContent = content;
  current.lastModified = lastModified || current.lastModified || Date.now();
  if (fileSize !== undefined) current.fileSize = fileSize;
  current.needsPermission = false;
  delete current.externalContent;
  delete current.externalLastModified;

  filenameEl.textContent = current.name;
  if (isSourceMode) {
    sourceEditor.value = content;
    updateOutline();
  } else {
    loadMarkdown(content);
  }
  markSaved();
  renderFileList();
  updateLinkHint();
  saveSession();
  showReloadNotice();
}

function showReloadNotice() {
  modifiedEl.textContent = '已重新加载';
  setTimeout(() => {
    if (!isModified && modifiedEl.textContent === '已重新加载') {
      modifiedEl.textContent = '';
    }
  }, 1800);
}

async function reloadFile() {
  if (activeFileIndex < 0) {
    alert('请先打开 Markdown 文件');
    return;
  }

  const current = openFiles[activeFileIndex];
  if (!isSourceMode) flushPreviewChanges();
  const localContent = isSourceMode ? sourceEditor.value : current.content;
  if (localContent !== current.savedContent &&
      !confirm('当前文件有未保存修改。重新加载会丢弃这些修改，是否继续？')) {
    return;
  }
  await createHistorySnapshot(current, '重新加载前', localContent);

  try {
    if (current.serverPath) {
      const contentResponse = await fetch('/api/read?file=' + encodeURIComponent(current.serverPath));
      if (!contentResponse.ok) throw new Error('读取文件失败（HTTP ' + contentResponse.status + '）');
      const content = await contentResponse.text();

      let lastModified = current.lastModified;
      try {
        const mtimeResponse = await fetch('/api/mtime?file=' + encodeURIComponent(current.serverPath));
        if (mtimeResponse.ok) {
          serverFileLastMtime = await mtimeResponse.text();
          lastModified = serverMtimeToMilliseconds(serverFileLastMtime);
        }
      } catch (e) { /* content reload already succeeded */ }

      applyReloadedContent(current, content, lastModified);
      return;
    }

    if (current.handle) {
      if (typeof current.handle.queryPermission === 'function') {
        let permission = await current.handle.queryPermission({ mode: 'read' });
        if (permission !== 'granted' && typeof current.handle.requestPermission === 'function') {
          permission = await current.handle.requestPermission({ mode: 'read' });
        }
        if (permission !== 'granted') throw new Error('未获得文件读取权限');
      }

      const file = await current.handle.getFile();
      const content = await file.text();
      applyReloadedContent(current, content, file.lastModified, file.size);
      return;
    }

    if (window.showOpenFilePicker) {
      const [handle] = await window.showOpenFilePicker({
        multiple: false,
        types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md', '.markdown', '.txt'] } }]
      });
      const file = await handle.getFile();
      const content = await file.text();
      current.handle = handle;
      current.name = file.name;
      applyReloadedContent(current, content, file.lastModified, file.size);
      await saveHandlesToDB();
      return;
    }

    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.md,.markdown,.txt';
    input.onchange = (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        current.name = file.name;
        applyReloadedContent(current, reader.result, file.lastModified, file.size);
      };
      reader.onerror = () => alert('重新加载失败：无法读取文件');
      reader.readAsText(file);
    };
    input.click();
  } catch (e) {
    if (e.name !== 'AbortError') {
      current.needsPermission = !!current.handle;
      updateLinkHint();
      alert('重新加载失败：' + (e.message || e));
    }
  }
}

async function openFileModern() {
  if (window.showOpenFilePicker) {
    try {
      const handles = await window.showOpenFilePicker({
        multiple: true,
        types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md', '.markdown', '.txt'] } }]
      });
      for (const handle of handles) {
        const file = await handle.getFile();
        const content = await file.text();
        const existing = openFiles.findIndex(f => f.name === file.name);
        if (existing >= 0) {
          openFiles[existing].content = content;
          openFiles[existing].savedContent = content;
          openFiles[existing].handle = handle;
          openFiles[existing].needsPermission = false;
          openFiles[existing].lastModified = file.lastModified;
          openFiles[existing].fileSize = file.size;
          switchFile(existing);
        } else {
          openFiles.push({ name: file.name, content, savedContent: content, handle, needsPermission: false, lastModified: file.lastModified, fileSize: file.size });
          switchFile(openFiles.length - 1);
          renderFileList();
        }
      }
    } catch (e) {
      if (e.name !== 'AbortError') console.error(e);
    }
    saveHandlesToDB();
  } else {
    fileInput.click();
  }
}

// Auto-refresh: poll the active file handle every second
let autoRefreshInterval = null;
let autoRefreshInFlight = false;

function startAutoRefresh() {
  if (autoRefreshInterval) return;
  autoRefreshInterval = setInterval(autoRefreshCurrent, 1000);
}

async function autoRefreshCurrent() {
  if (document.hidden || autoRefreshInFlight || activeFileIndex < 0) return;
  if (!isSourceMode && previewDirty) return;
  const current = openFiles[activeFileIndex];
  if (!current.handle || current.needsPermission) return;

  autoRefreshInFlight = true;
  try {
    const file = await current.handle.getFile();
    if (openFiles[activeFileIndex] !== current) return;

    const metadataUnchanged = current.lastModified === file.lastModified &&
      current.fileSize === file.size;
    if (metadataUnchanged) return;

    const content = await file.text();
    if (openFiles[activeFileIndex] !== current) return;

    current.lastModified = file.lastModified;
    current.fileSize = file.size;
    updateLastModifiedDisplay();
    const localContent = isSourceMode ? sourceEditor.value : current.content;
    if (content !== current.savedContent) {
      if (localContent !== current.savedContent && localContent !== content) {
        current.externalContent = content;
        current.externalLastModified = file.lastModified;
        modifiedEl.textContent = '有未保存修改（磁盘文件也已更新）';
        return;
      }

      await createHistorySnapshot(current, '外部更新前', localContent);
      current.content = content;
      current.savedContent = content;
      delete current.externalContent;
      delete current.externalLastModified;
      if (isSourceMode) {
        sourceEditor.value = content;
        updateOutline();
      } else {
        loadMarkdown(content);
      }
      markSaved();
      saveSession();
    }
  } catch (e) {
    if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) {
      current.needsPermission = true;
      updateLinkHint();
      console.warn('Auto-refresh paused; file access must be authorized again.', e);
    } else {
      console.warn('Temporary auto-refresh error; polling will continue.', e);
    }
  } finally {
    autoRefreshInFlight = false;
  }
}

// Refresh immediately when the page or browser window becomes active again
function refreshWhenActive() {
  if (!document.hidden) {
    autoRefreshCurrent();
    serverPollFile();
  }
}
document.addEventListener('visibilitychange', refreshWhenActive);
window.addEventListener('focus', refreshWhenActive);

startAutoRefresh();

// === Server-mode file watching (polling mtime) ===
let serverWatchInterval = null;
let serverFileLastMtime = null;
let serverWatchedPath = null;
let serverPollInFlight = false;

function startServerWatch() {
  if (!isServerMode) return;
  if (serverWatchInterval) return;
  serverWatchInterval = setInterval(serverPollFile, 800);
}

function stopServerWatch() {
  if (serverWatchInterval) { clearInterval(serverWatchInterval); serverWatchInterval = null; }
  serverFileLastMtime = null;
  serverWatchedPath = null;
}

async function serverPollFile() {
  if (document.hidden || serverPollInFlight || activeFileIndex < 0) return;
  const current = openFiles[activeFileIndex];
  if (!current.serverPath) return;
  const watchedPath = current.serverPath;
  if (serverWatchedPath !== watchedPath) {
    serverWatchedPath = watchedPath;
    serverFileLastMtime = null;
  }
  serverPollInFlight = true;
  try {
    const resp = await fetch('/api/mtime?file=' + encodeURIComponent(watchedPath));
    if (openFiles[activeFileIndex] !== current || current.serverPath !== watchedPath || !resp.ok) return;
    const mtime = await resp.text();
    if (openFiles[activeFileIndex] !== current || current.serverPath !== watchedPath) return;
    current.lastModified = serverMtimeToMilliseconds(mtime);
    updateLastModifiedDisplay();
    if (serverFileLastMtime && mtime !== serverFileLastMtime) {
      const contentResp = await fetch('/api/read?file=' + encodeURIComponent(watchedPath));
      if (openFiles[activeFileIndex] !== current || current.serverPath !== watchedPath || !contentResp.ok) return;
      const content = await contentResp.text();
      if (openFiles[activeFileIndex] !== current || current.serverPath !== watchedPath) return;
      const localContent = isSourceMode ? sourceEditor.value : current.content;
      if (content !== current.savedContent) {
        if (localContent !== current.savedContent && localContent !== content) {
          current.externalContent = content;
          current.externalLastModified = current.lastModified;
          modifiedEl.textContent = '有未保存修改（磁盘文件也已更新）';
        } else {
          await createHistorySnapshot(current, '外部更新前', localContent);
          if (openFiles[activeFileIndex] !== current || current.serverPath !== watchedPath) return;
          current.content = content;
          current.savedContent = content;
          delete current.externalContent;
          delete current.externalLastModified;
          if (isSourceMode) {
            sourceEditor.value = content;
            updateOutline();
          } else {
            loadMarkdown(content);
          }
          markSaved();
          saveSession();
        }
      }
    }
    serverFileLastMtime = mtime;
  } catch (e) { /* server unreachable, ignore */ }
  finally { serverPollInFlight = false; }
}

// Open file via server (prompt for path)
async function openFileFromServer() {
  const filePath = prompt('输入 .md 文件完整路径（如 C:\\Users\\xxx\\doc.md）:');
  if (!filePath) return;
  await openServerFile(filePath);
}

async function openFileFromServerList() {

  fb.classList.add('active');

  await fbNavigate(fbCurrentPath || '');

function closeFileBrowser() {

}

async function fbNavigate(dir) {
  try {
    const resp = await fetch('/api/list?dir=' + encodeURIComponent(dir || ''));
    if (!resp.ok) { fbRenderError('无法读取目录'); return; }
    const data = await resp.json();
    fbCurrentPath = data.path;
    document.getElementById('fbPathInput').value = data.path === 'DRIVES' ? '（所有磁盘）' : data.path;
    fbRender(data);
  } catch (e) {
    fbRenderError('服务器连接失败');
  }

function fbGoUp() {
  fetch('/api/list?dir=' + encodeURIComponent(fbCurrentPath || ''))
    .then(r => r.json())
    .then(data => { if (data.parent !== null && data.parent !== undefined) fbNavigate(data.parent); });
}

function fbRender(data) {
  const list = document.getElementById('fbList');
  let html = '';
  (data.dirs || []).forEach(d => {
    html += '<div class="fb-item fb-dir" data-path="' + encodeURIComponent(d.path) + '" data-type="dir">' +
      '<span class="fb-icon">📁</span><span>' + escapeHtmlAttr(d.name) + '</span></div>';
  });
  (data.files || []).forEach(f => {
    html += '<div class="fb-item fb-file" data-path="' + encodeURIComponent(f.path) + '" data-type="file">' +
      '<span class="fb-icon">📄</span><span>' + escapeHtmlAttr(f.name) + '</span></div>';
  });

function fbRenderError(msg) {
  document.getElementById('fbList').innerHTML = '<div class="fb-empty">' + msg + '</div>';
}

function escapeHtmlAttr(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function openServerFile(filePath) {
  try {
    const resp = await fetch('/api/read?file=' + encodeURIComponent(filePath));
    if (!resp.ok) { alert('无法读取文件: ' + filePath); return; }
    const content = await resp.text();
    const name = filePath.split(/[\\/]/).pop();
    const existing = openFiles.findIndex(f => f.serverPath === filePath);
    if (existing >= 0) {
      openFiles[existing].content = content;
      openFiles[existing].savedContent = content;
      switchFile(existing);
    } else {
      openFiles.push({ name, content, savedContent: content, handle: null, serverPath: filePath });
      switchFile(openFiles.length - 1);
      renderFileList();
    }
    serverFileLastMtime = null;
    startServerWatch();
    saveSession();
  } catch (e) {
    alert('无法读取文件: ' + e.message);
  }
}

function switchFile(index) {
  if (activeFileIndex >= 0 && activeFileIndex < openFiles.length) {
    const previousFile = openFiles[activeFileIndex];
    if (isSourceMode) {
      previousFile.content = sourceEditor.value;
    } else {
      flushPreviewChanges();
    }
    createHistorySnapshot(previousFile, '切换文件前', previousFile.content);
  }
  activeFileIndex = index;
  if (index >= 0 && index < openFiles.length) {
    const file = openFiles[index];
    ensureHistoryKey(file);
    createHistorySnapshot(file, '打开文件', file.savedContent);
    filenameEl.textContent = file.name;
    if (isSourceMode) { sourceEditor.value = file.content; }
    else { loadMarkdown(file.content); }
    markModified();
  }
  updateLastModifiedDisplay();
  renderFileList();
  saveSession();
  checkNeedRelink();
  // Start/stop server watch based on whether active file has serverPath
  if (isServerMode && index >= 0 && index < openFiles.length && openFiles[index].serverPath) {
    serverFileLastMtime = null;
    startServerWatch();
    serverPollFile();
  } else {
    stopServerWatch();
  }
}

function closeFile(index, event) {
  if (event) event.stopPropagation();
  openFiles.splice(index, 1);
  if (openFiles.length === 0) {
    activeFileIndex = -1;
    filenameEl.textContent = '未打开文件';
    filenameEl.classList.remove('modified');
    modifiedEl.textContent = '';
    isModified = false;
    updateLastModifiedDisplay();
    editorEl.innerHTML = '<div class="welcome"><div class="welcome-icon">📝</div><h2>Markdown Editor</h2><p><kbd>Ctrl+O</kbd> 打开文件&emsp;<kbd>Ctrl+S</kbd> 保存&emsp;<kbd>Ctrl+/</kbd> 源码模式<br><kbd>Ctrl+B</kbd> 粗体&emsp;<kbd>Ctrl+I</kbd> 斜体&emsp;拖放 .md 文件到窗口打开</p></div>';
  } else if (activeFileIndex >= openFiles.length) {
    switchFile(openFiles.length - 1);
  } else if (activeFileIndex === index) {
    switchFile(Math.min(index, openFiles.length - 1));
  }
  renderFileList();
  saveSession();
}

function renderFileList() {
  fileListEl.innerHTML = openFiles.map((f, i) =>
    '<li class="' + (i === activeFileIndex ? 'active' : '') + '" onclick="switchFile(' + i + ')">' +
    '<span>📄</span><span>' + f.name + '</span>' +
    '<span class="close-btn" onclick="closeFile(' + i + ', event)">×</span></li>'
  ).join('');
}

// Outline
let outlineUpdateTimer = null;
let sourceCompositionActive = false;
let lastOutlineHtml = null;

function getSourceHeadings(markdown) {
  const lines = markdown.split('\n');
  const headings = [];
  let offset = 0;
  let fenceMarker = '';
  let fenceLength = 0;

  lines.forEach(line => {
    const cleanLine = line.replace(/\r$/, '');
    if (fenceMarker) {
      const closingFence = cleanLine.match(/^\s*(`+|~+)\s*$/);
      if (closingFence && closingFence[1][0] === fenceMarker && closingFence[1].length >= fenceLength) {
        fenceMarker = '';
        fenceLength = 0;
      }
    } else {
      const fence = cleanLine.match(/^\s*(`{3,}|~{3,}).*$/);
      if (fence) {
        fenceMarker = fence[1][0];
        fenceLength = fence[1].length;
      } else {
        const heading = cleanLine.match(/^(#{1,6})\s+(.*)$/);
        if (heading) {
          headings.push({
            level: 'h' + heading[1].length,
            text: heading[2].trim(),
            start: offset,
            end: offset + cleanLine.length
          });
        }
      }
    }
    offset += line.length + 1;
  });

  return headings;
}

function updateOutline() {
  if (outlineUpdateTimer) {
    clearTimeout(outlineUpdateTimer);
    outlineUpdateTimer = null;
  }
  const headings = isSourceMode
    ? getSourceHeadings(sourceEditor.value)
    : Array.from(editorEl.querySelectorAll('h1, h2, h3, h4, h5, h6')).map(h => ({
        level: h.tagName.toLowerCase(),
        text: h.textContent.trim()
      }));
  const html = headings.map((h, i) =>
    '<li class="' + h.level + '" onclick="scrollToHeading(' + i + ')">' + escHtml(h.text) + '</li>'
  ).join('');
  if (html !== lastOutlineHtml) {
    outlineListEl.innerHTML = html;
    lastOutlineHtml = html;
  }
}

function scheduleOutlineUpdate(delay = 180) {
  if (outlineUpdateTimer) clearTimeout(outlineUpdateTimer);
  if (sourceCompositionActive || outlineListEl.style.display === 'none') return;
  outlineUpdateTimer = setTimeout(updateOutline, delay);
}

function getTextareaPositionTop(textarea, position) {
  const computed = getComputedStyle(textarea);
  const mirror = document.createElement('div');
  const copiedStyles = [
    'fontFamily', 'fontSize', 'fontWeight', 'fontStyle', 'letterSpacing',
    'lineHeight', 'textTransform', 'textIndent', 'wordSpacing', 'wordBreak',
    'overflowWrap', 'tabSize', 'paddingTop', 'paddingRight', 'paddingBottom',
    'paddingLeft'
  ];

  copiedStyles.forEach(property => {
    mirror.style[property] = computed[property];
  });
  mirror.style.position = 'fixed';
  mirror.style.left = '-9999px';
  mirror.style.top = '0';
  mirror.style.visibility = 'hidden';
  mirror.style.boxSizing = 'border-box';
  mirror.style.width = textarea.clientWidth + 'px';
  mirror.style.height = 'auto';
  mirror.style.border = '0';
  mirror.style.whiteSpace = 'pre-wrap';
  mirror.style.overflowWrap = 'break-word';
  mirror.style.wordWrap = 'break-word';

  mirror.textContent = textarea.value.slice(0, position);
  const marker = document.createElement('span');
  marker.textContent = '\u200b';
  mirror.appendChild(marker);
  document.body.appendChild(mirror);
  const top = marker.offsetTop;
  mirror.remove();
  return top;
}

function scrollToHeading(index) {
  if (isSourceMode) {
    const heading = getSourceHeadings(sourceEditor.value)[index];
    if (!heading) return;

    const headingTop = getTextareaPositionTop(sourceEditor, heading.start);
    sourceEditor.focus();
    sourceEditor.setSelectionRange(heading.start, heading.end);
    sourceEditor.scrollTo({
      top: Math.max(0, headingTop - sourceEditor.clientHeight / 3),
      behavior: 'smooth'
    });
    outlineListEl.querySelectorAll('li').forEach((li, i) => {
      li.classList.toggle('active-heading', i === index);
    });
    return;
  }

  const headings = editorEl.querySelectorAll('h1, h2, h3, h4, h5, h6');
  if (headings[index]) {
    headings[index].scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function positionTextColorPalette() {

function getCurrentEditorSelectionRange() {
  const selection = window.getSelection();
  if (!selection || !selection.rangeCount || selection.isCollapsed) return null;
  const range = selection.getRangeAt(0);
  const container = range.commonAncestorContainer.nodeType === 1
    ? range.commonAncestorContainer : range.commonAncestorContainer.parentElement;
  return container && editorEl.contains(container) ? range.cloneRange() : null;
}

function rememberCurrentEditorSelection() {
  const range = getCurrentEditorSelectionRange();
  if (range) lastEditorSelectionRange = range;
  return range;
}

function isUsableEditorRange(range) {
  if (!range || range.collapsed) return false;
  const container = range.commonAncestorContainer.nodeType === 1
    ? range.commonAncestorContainer : range.commonAncestorContainer.parentElement;
  return !!(container && container.isConnected && editorEl.contains(container));
}

function toggleTextColorPalette() {
  if (isSourceMode) return;
  const palette = document.getElementById('textColorPalette');
  if (palette.classList.contains('active')) {
    hideTextColorPalette();
    return;
  }
  const currentRange = rememberCurrentEditorSelection();
  const range = currentRange || lastEditorSelectionRange;
  if (!isUsableEditorRange(range)) return;
  savedTextColorRange = range.cloneRange();
  hideTableCellTools();
  palette.classList.add('active');
  const button = document.getElementById('textColorBtn');
  button.classList.add('active');
  button.setAttribute('aria-expanded', 'true');
  requestAnimationFrame(positionTextColorPalette);
}

function wrapTextNodesInRange(range, token) {
  const segments = [];
  const walker = document.createTreeWalker(editorEl, NodeFilter.SHOW_TEXT);
  let node;
  while ((node = walker.nextNode())) {
    if (!node.data || !range.intersectsNode(node)) continue;
    const blocked = node.parentElement && node.parentElement.closest('[contenteditable="false"],.code-copy-btn,.code-lang-label');
    if (blocked) continue;
    let start = node === range.startContainer ? range.startOffset : 0;
    let end = node === range.endContainer ? range.endOffset : node.data.length;
    start = Math.max(0, Math.min(start, node.data.length));
    end = Math.max(start, Math.min(end, node.data.length));
    if (end > start) segments.push({ node, start, end });
  }
  segments.reverse().forEach(segment => {
    let selectedNode = segment.node;
    if (segment.end < selectedNode.data.length) selectedNode.splitText(segment.end);
    if (segment.start > 0) selectedNode = selectedNode.splitText(segment.start);
    const span = document.createElement('span');
    span.setAttribute('text-color', token);
    selectedNode.parentNode.insertBefore(span, selectedNode);
    span.appendChild(selectedNode);
  });
  return segments.length > 0;
}

function selectionHasTextColor(range, token) {
  return Array.from(editorEl.querySelectorAll('span,font')).some(element => {
    try { return getElementTextColorToken(element) === token && range.intersectsNode(element); }
    catch (error) { return false; }
  });
}

function applyTextColor(token) {
  if (!FEISHU_TEXT_COLORS[token] || !isUsableEditorRange(savedTextColorRange)) return;
  clearCellBackgroundHistory();
  const originalRange = savedTextColorRange.cloneRange();
  editorEl.focus();
  const selection = window.getSelection();
  selection.removeAllRanges();
  selection.addRange(originalRange);
  document.execCommand('styleWithCSS', false, 'true');
  const applied = document.execCommand('foreColor', false, FEISHU_TEXT_COLORS[token]);
  const resultingRange = selection.rangeCount ? selection.getRangeAt(0).cloneRange() : null;
  if (!applied || !resultingRange || !selectionHasTextColor(resultingRange, token)) {
    selection.removeAllRanges();
    selection.addRange(originalRange);
    wrapTextNodesInRange(originalRange, token);
  }
  lastEditorSelectionRange = null;
  savedTextColorRange = null;
  hideTextColorPalette();

}

function insertHeading(level) {
  const sel = window.getSelection();
  if (!sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  let block = range.startContainer;
  while (block && block !== editorEl && block.nodeType !== 1) block = block.parentNode;
  if (!block || block === editorEl) {
    document.execCommand('formatBlock', false, 'h' + level);
  } else {
    const heading = document.createElement('h' + level);
    heading.innerHTML = block.innerHTML;
    block.parentNode.replaceChild(heading, block);
  }
  editorEl.focus();
  updateOutline();
}

function insertCodeBlock() {

  if (lang === 'mermaid') { insertMermaidWithCode(code || 'graph TD\n    A-->B'); return; }

    pre.insertBefore(label, codeEl);

  copyBtn.className = 'code-copy-btn';

  copyBtn.contentEditable = 'false';
  pre.insertBefore(copyBtn, codeEl);

async function insertMermaidWithCode(code) {
  mermaidId++;
  observerPaused = true;
  const container = document.createElement('div');
  container.className = 'mermaid-container';
  container.contentEditable = 'false';
  container.setAttribute('data-mermaid-source', encodeURIComponent(code));
  const div = document.createElement('div');
  div.className = 'mermaid';
  div.id = 'mermaid-' + mermaidId;
  container.appendChild(div);
  try {
    await loadMermaidLib();
    const uniqueId = 'mermaid-insert-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
    if (typeof mermaid === 'undefined') throw new Error('mermaid is not loaded');
    const { svg } = await mermaid.render(uniqueId, code);
    div.innerHTML = svg;
  } catch (e) {
    div.innerHTML = '<pre style="text-align:left;font-size:12px;">' + escHtml(code) + '</pre><div style="font-size:11px;color:#999;">（mermaid.min.js 加载失败）</div>';
  }
  const sel = window.getSelection();
  if (sel.rangeCount) { const r = sel.getRangeAt(0); r.deleteContents(); r.insertNode(container); }
  else editorEl.appendChild(container);
  observerPaused = false;
}
